<style>
  :root { --bar: rgba(30, 20, 14, .72); --bar-ink: #fbf4e8; --accent: #b5532f; }

  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1411; color: #3b2c22;

    background: var(--bar); color: var(--bar-ink); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);

  .room-title span { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
  .found { font-size: 14px; opacity: .85; white-space: nowrap; }

  #menu {
    position: fixed; top: 64px; left: 16px; z-index: 11; width: 240px; padding: 8px;

  #menu button { display: block; width: 100%; text-align: left; background: transparent; border: 0; color: inherit;
    padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 15px; }
  #menu button:hover { background: rgba(255,255,255,.1); }
  #menu button.here { color: #ffe58a; }


  .hint {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 6; opacity: 0;
    background: rgba(30,20,14,.75); color: #fbf4e8; padding: 9px 16px; border-radius: 999px; font-size: 14px; pointer-events: none;
    white-space: nowrap; transition: opacity .6s ease;
  }
  #fade { position: fixed; inset: 0; background: #120d0a; z-index: 20; pointer-events: none; opacity: 0; transition: opacity .35s ease; }
  #intro { position: fixed; inset: 0; z-index: 30; background: #cfe6f4; }
  #intro svg { display: block; width: 100%; height: 100%; }
  .intro-text { position: absolute; left: 16px; right: 16px; top: max(5vh, 20px); text-align: center; color: #2f241c; pointer-events: none; transition: opacity .5s ease; }
  .intro-eyebrow { margin: 0 0 6px; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: #8a3b1e; }
  .intro-text h1 { margin: 0 0 10px; font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: clamp(38px, 6.5vw, 72px); line-height: 1; }
  #introStatus { margin: 0; font-family: "Fraunces", Georgia, serif; font-style: italic; font-size: 19px; color: #4a3a2e; }
  #introStatus.loading::after { content: ""; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.4s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  @media (max-width: 700px) {
    .found { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

      <radialGradient id="in-sun"><stop offset="0" stop-color="#fffbe6"/><stop offset=".3" stop-color="#fff2b8" stop-opacity=".8"/><stop offset="1" stop-color="#fff2b8" stop-opacity="0"/></radialGradient>
      <radialGradient id="in-glow" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#ffe0a0" stop-opacity=".9"/><stop offset="1" stop-color="#ffe0a0" stop-opacity="0"/></radialGradient>
      <pattern id="in-cedar" width="22" height="40" patternUnits="userSpaceOnUse">

      <circle cx="1330" cy="140" r="190" fill="url(#in-sun)"/><circle cx="1330" cy="140" r="46" fill="#fffbe6"/>
      <g fill="#fff" opacity=".85"><ellipse cx="300" cy="140" rx="110" ry="26"/><ellipse cx="360" cy="122" rx="70" ry="30"/><ellipse cx="980" cy="100" rx="80" ry="20"/><ellipse cx="1020" cy="86" rx="50" ry="22"/></g>

      <g fill="#86a46c"><circle cx="60" cy="620" r="70"/><circle cx="160" cy="610" r="60"/><circle cx="1450" cy="615" r="70"/><circle cx="1550" cy="625" r="60"/></g>

<script>
// Draws the parts of the front that repeat, and swings the door open once the 3D house is ready.
(() => {
  const NS = (tag, attrs) => `<${tag} ${Object.entries(attrs).map(([k, v]) => `${k}="${v}"`).join(' ')}/>`;
  const win = (x, y, w, h) => {
    let s = NS('rect', { x: x - 6, y: y - 6, width: w + 12, height: h + 12, fill: '#2f2a25' }) + NS('rect', { x, y, width: w, height: h, fill: '#c6d7d9' }) +
      NS('path', { d: `M${x + 16} ${y + h - 18} L${x + w * .4} ${y + 14}`, stroke: '#fff', 'stroke-width': 8, opacity: .4 });
    const n = Math.max(1, Math.round(w / 110));
    for (let i = 1; i < n; i++) s += NS('rect', { x: x + w * i / n - 3, y, width: 6, height: h, fill: '#2f2a25' });
    return s + NS('rect', { x: x - 10, y: y + h + 6, width: w + 20, height: 6, fill: '#8a6440' });
  };
  // living room and kitchen below, the two bedrooms above
  document.getElementById('in-win').innerHTML = win(244, 511, 205, 148) + win(1083, 511, 209, 103) + win(650, 261, 281, 132) + win(1113, 261, 260, 132) +
    NS('path', { d: 'M1110 614 l3 -16 h14 l3 16z', fill: '#b5532f' }) + NS('ellipse', { cx: 1120, cy: 590, rx: 12, ry: 10, fill: '#5f7d4a' });
  const shrub = (x, r, c) => NS('ellipse', { cx: x, cy: 700, rx: r, ry: r * .7, fill: c });
  document.getElementById('in-shrubs').innerHTML = [230, 300, 480, 860, 940, 1010, 1330, 1385].map((x, i) => shrub(x, 40 + (i % 3) * 6, i % 2 ? '#5f7d4a' : '#6d8a52')).join('');
  const tree = (x, y, k) => `<path d="M${x} ${y} C${x - 6} ${y - 90 * k} ${x + 8} ${y - 150 * k} ${x} ${y - 200 * k}" stroke="#6b5233" stroke-width="${24 * k}" fill="none" stroke-linecap="round"/>
    <g transform="translate(${x} ${y - 260 * k}) scale(${k})"><circle cx="-80" cy="30" r="90" fill="#5f7d4a"/><circle cx="80" cy="30" r="90" fill="#5f7d4a"/><circle cx="0" cy="-30" r="110" fill="#6d8a52"/><circle cx="-40" cy="-60" r="60" fill="#7f9a62"/><circle cx="50" cy="0" r="66" fill="#7f9a62"/></g>`;
  document.getElementById('in-trees').innerHTML = tree(80, 770, 1.25) + tree(1530, 780, 1.3);

  // Oak door leaves, drawn in perspective: each leaf swings inward on its hinge
  const TOP = 503, BOT = 700, MID = 601, W = 63;
  const leaves = [{ g: document.getElementById('leafL'), hinge: 620, dir: 1 }, { g: document.getElementById('leafR'), hinge: 746, dir: -1 }];
  function drawLeaf(l, th) {
    const cos = Math.cos(th), sin = Math.sin(th), s = 1 - .22 * sin;   // the far edge shrinks as it swings away
    const map = (u, v) => {
      const x = l.hinge + l.dir * u * W * cos;
      const top = TOP + (MID - (MID - TOP) * s - TOP) * u, bot = BOT + (MID + (BOT - MID) * s - BOT) * u;
      return [x, top + (bot - top) * v];
    };
    const poly = pts => pts.map(p => map(...p).map(n => n.toFixed(1)).join(',')).join(' ');
    let out = NS('polygon', { points: poly([[0, 0], [1, 0], [1, 1], [0, 1]]), fill: '#8a5f3c' });
    for (const u of [.2, .4, .6]) out += NS('polygon', { points: poly([[u - .012, .03], [u + .012, .03], [u + .012, .97], [u - .012, .97]]), fill: '#6e4a2e' });
    out += NS('polygon', { points: poly([[.84, .36], [.9, .36], [.9, .64], [.84, .64]]), fill: '#2a2420' });
    out += NS('polygon', { points: poly([[0, 0], [1, 0], [1, 1], [0, 1]]), fill: '#000', opacity: (.55 * sin).toFixed(3) });
    l.g.innerHTML = out;
  }
  leaves.forEach(l => drawLeaf(l, 0));

  const intro = document.getElementById('intro'), facade = document.getElementById('facade');
  const status = document.getElementById('introStatus'), spill = document.getElementById('spill');
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const tween = (ms, fn) => new Promise(res => {
    const t0 = performance.now();
    const step = now => { const t = Math.min(1, (now - t0) / ms); fn(t); t < 1 ? requestAnimationFrame(step) : res(); };
    requestAnimationFrame(step);
  });
  const wait = ms => new Promise(r => setTimeout(r, ms));

  // Called by the 3D scene once it's built. onReveal fires as the house appears behind the doorway.
  window.openFrontDoor = async (onReveal) => {
    status.classList.remove('loading');
    status.textContent = 'Welcome home';
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { onReveal && onReveal(); intro.remove(); return; }
    await wait(700);
    await tween(1600, t => { const th = 1.38 * ease(t); leaves.forEach(l => drawLeaf(l, th)); spill.setAttribute('opacity', (.55 * Math.sin(th)).toFixed(3)); });
    document.querySelector('.intro-text').style.opacity = 0;
    let revealed = false;
    await tween(1500, t => {
      const e = ease(t), s = 1 + 11 * e * e;
      facade.setAttribute('transform', `translate(683 601) scale(${s.toFixed(3)}) translate(-683 -601)`);
      if (t > .55) {
        if (!revealed) { revealed = true; onReveal && onReveal(); }
        intro.style.opacity = (1 - (t - .55) / .45).toFixed(3);
      }
    });
    intro.remove();
  };
  setTimeout(() => { if (!window.__ready && document.body.contains(intro)) status.textContent = 'Still building… this needs an internet connection'; }, 25000);
})();
</script>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ============================================================
   Coordinates come straight from the floor plan slides (pixels on a
   2000-px-wide render). The house is 80' × 40', so plan x and plan y
   scale differently. x grows east, z grows south, y is up (metres).
   ============================================================ */
const SX = 24.384 / 1220, SZ = 12.192 / 783;
const X = px => (px - 835) * SX;
const Z = py => (py - 555) * SZ;
const GROUND = 0, UPPER = 3.05;   // 10' floor to floor
const H1 = 2.75, UPH = 2.6;       // 9' ceilings downstairs, 8'6" upstairs
const EYE = 1.6;

/* ---------- renderer, scene, camera ---------- */
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
view.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(68, innerWidth / innerHeight, 0.05, 1200);
camera.rotation.order = 'YXZ';

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

/* ---------- light: a clear, sunny day ---------- */
const sun = new THREE.DirectionalLight(0xfff1d6, 4.2);
const SUN_DIR = new THREE.Vector3(0.35, 1, 0.45).normalize();
sun.position.copy(SUN_DIR).multiplyScalar(40).add(new THREE.Vector3(2, 0, 0));
sun.target.position.set(2, 0, 0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20, near: 1, far: 90 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight(0xcfe6ff, 0x8a6a4a, 0.35));

/* ============================================================
   Procedural textures, drawn on canvases
   ============================================================ */
function rng(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

function tex(size, draw, tile = 1, w = size, h = size) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  t.userData.tile = tile;
  return t;
}
function speckle(g, w, h, colors, n, rmax, seed, alpha = .25) {
  const r = rng(seed);
  for (let i = 0; i < n; i++) {
    g.globalAlpha = alpha * r();
    g.fillStyle = colors[Math.floor(r() * colors.length)];
    g.beginPath(); g.arc(r() * w, r() * h, r() * rmax + .4, 0, 7); g.fill();
  }
  g.globalAlpha = 1;
}

const T = {
  plaster: tex(512, (g, w, h) => { g.fillStyle = '#efe3cc'; g.fillRect(0, 0, w, h); speckle(g, w, h, ['#e2d2b4', '#f7eedd', '#d9c7a4'], 2600, 14, 3, .18); }, 2),
  white: tex(512, (g, w, h) => { g.fillStyle = '#f2eee6'; g.fillRect(0, 0, w, h); speckle(g, w, h, ['#e7e1d6', '#faf7f1'], 1500, 10, 5, .15); }, 2),
  redOxide: tex(512, (g, w, h) => {
    g.fillStyle = '#93301f'; g.fillRect(0, 0, w, h);
    speckle(g, w, h, ['#7a2216', '#a8402c', '#6a1d13', '#b04a34'], 900, 40, 7, .2);
    g.strokeStyle = 'rgba(60,15,10,.35)'; g.lineWidth = 2; g.strokeRect(0, 0, w, h);
  }, 1.2),
  teak: tex(512, (g, w, h) => {
    g.fillStyle = '#6b4226'; g.fillRect(0, 0, w, h);
    const r = rng(11);
    for (let i = 0; i < 140; i++) {
      const y = r() * h, a = r() * .25;
      g.strokeStyle = `rgba(${r() < .5 ? '40,22,12' : '140,90,55'},${a})`; g.lineWidth = 1 + r() * 3;
      g.beginPath(); g.moveTo(0, y);
      for (let x = 0; x <= w; x += 32) g.lineTo(x, y + Math.sin(x / 60 + i) * 4);
      g.stroke();
    }
  }, 1),
  oak: tex(1024, (g, w, h) => {
    const r = rng(17), plank = h / 8;
    for (let row = 0; row < 8; row++) {
      let x = -r() * 300;
      while (x < w) {
        const len = 260 + r() * 300, tone = 180 + r() * 30;
        g.fillStyle = `rgb(${tone},${tone * .76 | 0},${tone * .5 | 0})`; g.fillRect(x, row * plank, len, plank);

/* ============================================================
   Geometry helpers (all in metres)
   ============================================================ */
const world = new THREE.Group(); scene.add(world);
function add(mesh, cast = true) { mesh.castShadow = cast; mesh.receiveShadow = true; world.add(mesh); return mesh; }

// tile = metres per texture repeat; 0 stretches the texture once over the face
function tileOf(mat) { const m = Array.isArray(mat) ? mat.find(x => x.map) : mat; if (!m || !m.map) return 0; const t = m.map.userData.tile; return t === undefined ? 1 : t; }
function boxGeo(w, h, d, tile) {
  const g = new THREE.BoxGeometry(w, h, d);
  if (tile) {
    const uv = g.attributes.uv, dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
    for (let f = 0; f < 6; f++) for (let i = 0; i < 4; i++) { const k = f * 4 + i; uv.setXY(k, uv.getX(k) * dims[f][0] / tile, uv.getY(k) * dims[f][1] / tile); }
  }
  return g;
}
// box from extents
function boxAt(mat, x0, x1, y0, y1, z0, z1, cast = true) {
  const w = Math.abs(x1 - x0), h = Math.abs(y1 - y0), d = Math.abs(z1 - z0);
  const m = new THREE.Mesh(boxGeo(w, h, d, tileOf(mat)), mat);
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  return add(m, cast);
}
// box from centre
function box(mat, x, y, z, w, h, d, cast = true) { return boxAt(mat, x - w / 2, x + w / 2, y - h / 2, y + h / 2, z - d / 2, z + d / 2, cast); }
function rbox(mat, x, y, z, w, h, d, r = .05) {
  const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 3, Math.min(r, w / 2, h / 2, d / 2)), mat);
  m.position.set(x, y, z); return add(m);
}
function cyl(mat, x, y0, z, r, h, rTop = r, seg = 28) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rTop, r, h, seg), mat);
  m.position.set(x, y0 + h / 2, z); return add(m);
}
function sphere(mat, x, y, z, r, sx = 1, sy = 1, sz = 1, detail = 16) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, detail, Math.max(8, detail * .7 | 0)), mat);
  m.position.set(x, y, z); m.scale.set(sx, sy, sz); return add(m);
}
function lathe(mat, pts, x, y0, z, seg = 40) {
  const m = new THREE.Mesh(new THREE.LatheGeometry(pts.map(([r, h]) => new THREE.Vector2(r, h)), seg), mat);
  m.position.set(x, y0, z); return add(m);
}
// a plane of canvas art facing a direction ('N' faces north, i.e. hangs on a south wall)
function panel(texture, x, y, z, w, h, face, emissive = 0) {
  const mat = new THREE.MeshStandardMaterial({ map: texture, roughness: .7, emissive: emissive ? 0xffffff : 0, emissiveMap: emissive ? texture : null, emissiveIntensity: emissive });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  m.position.set(x, y, z); m.rotation.y = { S: 0, N: Math.PI, E: Math.PI / 2, W: -Math.PI / 2 }[face];
  return add(m, false);
}
function pointLight(color, intensity, x, y, z, dist = 0) {
  const l = new THREE.PointLight(color, intensity, dist, 2); l.position.set(x, y, z); scene.add(l); return l;
}

/* ============================================================
   Walls, doors and windows, straight from the plan
   ============================================================ */
const WT_EXT = .22, WT_INT = .14;
const SOLIDS = [];   // walls and tall built-ins, for laying out the walk grid
const solid = (x0, x1, z0, z1, y0, y1) => SOLIDS.push({ x0: Math.min(x0, x1), x1: Math.max(x0, x1), z0: Math.min(z0, z1), z1: Math.max(z0, z1), y0, y1 });
const DOORWAYS = [];   // every doorway you can walk through, for linking rooms
// a box measured along a wall (a) and across it (d); horizontal walls run east-west
function wbox(horiz, mat, a0, a1, y0, y1, d0, d1, cast = true) { return horiz ? boxAt(mat, a0, a1, y0, y1, d0, d1, cast) : boxAt(mat, d0, d1, y0, y1, a0, a1, cast); }
// a framed glass panel lying in a wall's plane at depth d
function pane(horiz, a0, a1, y0, y1, d, frameMat = MAT.frame, f = .05, th = .04) {
  wbox(horiz, MAT.glass, a0, a1, y0, y1, d - .005, d + .005, false);
  wbox(horiz, frameMat, a0, a1, y0, y0 + f, d - th / 2, d + th / 2);
  wbox(horiz, frameMat, a0, a1, y1 - f, y1, d - th / 2, d + th / 2);
  wbox(horiz, frameMat, a0, a0 + f, y0, y1, d - th / 2, d + th / 2);
  wbox(horiz, frameMat, a1 - f, a1, y0, y1, d - th / 2, d + th / 2);
}

// wall(floor, x0, y0, x1, y1, options) — plan px; the wall is centred on the plan line.
// ext: which face is outdoors (N/S/E/W). neg/pos: inside finish on the north-or-west / south-or-east face.
// ops: openings [{a, b, t: window|door|french|slider|front|open, bottom, top, swing, hinge}]
function wall(fl, ax, ay, bx, by, o = {}) {
  const horiz = ay === by, t = o.ext ? WT_EXT : WT_INT;
  const y0 = fl, H = o.h ?? (fl === UPPER ? UPH + .3 : UPPER);
  const c = horiz ? Z(ay) : X(ax), conv = horiz ? X : Z;
  const from = conv(horiz ? Math.min(ax, bx) : Math.min(ay, by)) - (o.grow ? o.grow[0] : 0);
  const to = conv(horiz ? Math.max(ax, bx) : Math.max(ay, by)) + (o.grow ? o.grow[1] : 0);
  const extMat = fl === UPPER ? MAT.cedar : MAT.stucco;
  const neg = o.ext === (horiz ? 'N' : 'W') ? extMat : (o.neg || MAT.wall);
  const pos = o.ext === (horiz ? 'S' : 'E') ? extMat : (o.pos || MAT.wall);
  // material per box face: +x, -x, +y, -y, +z, -z
  const mats = Array(6).fill(MAT.wall);
  if (horiz) { mats[5] = neg; mats[4] = pos; } else { mats[1] = neg; mats[0] = pos; }
  const seg = (a, b, ya, yb) => {
    if (b - a < .005 || yb - ya < .005) return;
    wbox(horiz, mats, a, b, y0 + ya, y0 + yb, c - t / 2, c + t / 2);
    if (horiz) solid(a, b, c - t / 2, c + t / 2, y0 + ya, y0 + yb); else solid(c - t / 2, c + t / 2, a, b, y0 + ya, y0 + yb);
  };
  const ops = (o.ops || []).map(p => ({ ...p, a: conv(p.a), b: conv(p.b) })).sort((p, q) => p.a - q.a);
  let cur = from;
  for (const p of ops) {
    const bottom = p.t === 'window' ? p.bottom : 0, top = p.t === 'open' ? H : (p.top || (p.t === 'window' ? 2.3 : 2.1));
    seg(cur, p.a, 0, H); seg(p.a, p.b, 0, bottom); seg(p.a, p.b, top, H); cur = p.b;
    opening(horiz, c, t, y0, p, bottom, top);
  }
  seg(cur, to, 0, H);
}

function opening(horiz, c, t, y0, p, bottom, top) {
  const a = p.a, b = p.b;
  if (p.t === 'door' || p.t === 'french') DOORWAYS.push({ horiz, c, a, b, y0, top });
  if (p.t === 'slider') DOORWAYS.push({ horiz, c, a: a + (b - a) / 4 + .1, b: b - (b - a) / 4 - .1, y0, top });
  if (p.t === 'window') {
    pane(horiz, a, b, y0 + bottom, y0 + top, c, MAT.frame, .06, .07);
    const n = Math.max(1, Math.round((b - a) / 1.2));
    for (let i = 1; i < n; i++) { const m = a + (b - a) * i / n; wbox(horiz, MAT.frame, m - .025, m + .025, y0 + bottom, y0 + top, c - .03, c + .03); }
    wbox(horiz, MAT.oak, a - .04, b + .04, y0 + bottom - .04, y0 + bottom, c - t / 2 - .05, c + t / 2 + .05);
  }
  if (p.t === 'door') {
    // slim oak jambs, and the leaf standing open against the wall
    wbox(horiz, MAT.oak, a, b, y0 + top - .03, y0 + top, c - t / 2, c + t / 2);
    wbox(horiz, MAT.oak, a, a + .03, y0, y0 + top, c - t / 2, c + t / 2);
    wbox(horiz, MAT.oak, b - .03, b, y0, y0 + top, c - t / 2, c + t / 2);
    if (p.swing) {
      const hinge = p.hinge === 'b' ? b - .05 : a + .05, w = b - a - .08, d0 = p.swing > 0 ? c + t / 2 + .01 : c - t / 2 - .01 - w;
      wbox(horiz, MAT.oak, hinge - .02, hinge + .02, y0 + .01, y0 + top - .04, d0, d0 + w);
    }
  }
  if (p.t === 'french') {
    // two glazed leaves swung open into the room
    const w = (b - a) / 2 - .03;
    for (const h of [a + .04, b - .04]) {
      const d0 = p.swing > 0 ? c + t / 2 + .02 : c - t / 2 - .02 - w;
      pane(!horiz, d0, d0 + w, y0 + .01, y0 + top, h, MAT.frame, .07, .05);
      wbox(!horiz, MAT.frame, d0, d0 + w, y0 + 1.0, y0 + 1.04, h - .02, h + .02);
    }
    wbox(horiz, MAT.frame, a, b, y0 + top - .05, y0 + top, c - t / 2, c + t / 2);
  }
  if (p.t === 'slider') {
    // four glass panels; the middle two are slid open behind the outer two
    const pw = (b - a) / 4;
    pane(horiz, a, a + pw + .04, y0, y0 + top, c - .04, MAT.frame, .06, .04);
    pane(horiz, b - pw - .04, b, y0, y0 + top, c - .04, MAT.frame, .06, .04);
    pane(horiz, a + .06, a + pw + .1, y0, y0 + top, c + .04, MAT.frame, .06, .04);
    pane(horiz, b - pw - .1, b - .06, y0, y0 + top, c + .04, MAT.frame, .06, .04);
    wbox(horiz, MAT.frame, a, b, y0 + top - .04, y0 + top, c - t / 2, c + t / 2);
    wbox(horiz, MAT.frame, a, b, y0, y0 + .015, c - t / 2, c + t / 2);
  }
  if (p.t === 'front') {
    const m = (a + b) / 2;
    wbox(horiz, MAT.door, a, m - .005, y0, y0 + top, c - .03, c + .03);
    wbox(horiz, MAT.door, m + .005, b, y0, y0 + top, c - .03, c + .03);
    for (const s of [-1, 1]) wbox(horiz, MAT.frame, m + s * .07 - .015, m + s * .07 + .015, y0 + .8, y0 + 1.5, c - .08, c + .08);
    wbox(horiz, MAT.oak, a - .06, b + .06, y0 + top, y0 + top + .06, c - t / 2 - .01, c + t / 2 + .01);
  }
}

/* ============================================================
   Furniture kit. Each piece is built facing local +z (where a
   seated person looks), then turned to face N, S, E, W or an angle.
   ============================================================ */
function piece(x, z, face = 'S', y = 0) {
  const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = typeof face === 'number' ? face : FACE[face]; world.add(g);
  const put = (m, px, py, pz) => { m.position.set(px, py, pz); m.castShadow = m.receiveShadow = true; g.add(m); return m; };
  return {
    g,
    box: (mat, px, py, pz, w, h, d) => put(new THREE.Mesh(boxGeo(w, h, d, tileOf(mat)), mat), px, py, pz),
    rbox: (mat, px, py, pz, w, h, d, r = .04) => put(new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 2, Math.min(r, w / 2, h / 2, d / 2)), mat), px, py, pz),
    cyl: (mat, px, py0, pz, r, h, rTop = r, seg = 20) => put(new THREE.Mesh(new THREE.CylinderGeometry(rTop, r, h, seg), mat), px, py0 + h / 2, pz),
    sph: (mat, px, py, pz, r, sx = 1, sy = 1, sz = 1) => { const m = put(new THREE.Mesh(new THREE.SphereGeometry(r, 14, 10), mat), px, py, pz); m.scale.set(sx, sy, sz); return m; },
    lathe: (mat, pts, px, py0, pz, seg = 28) => put(new THREE.Mesh(new THREE.LatheGeometry(pts.map(([r, h]) => new THREE.Vector2(r, h)), seg), mat), px, py0, pz),
  };
}
const shadeMat = () => { const m = glow(0xf6e6c6, .7); m.side = THREE.DoubleSide; return m; };

const SPINES = [0x8e3b2e, 0xc4813a, 0x5f6b45, 0xd8c9a3, 0x7a5a48, 0xa85a3a, 0x8a9a74, 0xc9a04a, 0x6a3f2f, 0xe0d4b8, 0x4a5a48, 0xb59a7a];
// bookshelf against a wall; axis 'x' runs east-west, facing +1 means it faces south/east
function bookshelf(axis, fixed, from, to, y0, height, depth, facing, seed, frame = MAT.oak) {
  const levels = Math.round(height / .36), r = rng(seed);
  const at = (u0, u1, ya, yb, d0, d1) => axis === 'x' ? boxAt(frame, u0, u1, ya, yb, fixed + facing * d0, fixed + facing * d1) : boxAt(frame, fixed + facing * d0, fixed + facing * d1, ya, yb, u0, u1);
  at(from, to, y0, y0 + height, 0, .03);
  for (let i = 0; i <= levels; i++) at(from, to, y0 + i * height / levels, y0 + i * height / levels + .025, 0, depth);
  for (let u = from; u <= to + .01; u += Math.max(.6, (to - from) / Math.round((to - from) / .9))) at(u - .015, u + .015, y0, y0 + height, 0, depth);
  const books = [];
  for (let i = 0; i < levels; i++) {
    const base = y0 + i * height / levels + .025;
    let u = from + .03;
    while (u < to - .05) {
      if (r() < .04) {   // a gap with a vase or a trailing plant in it
        const gu = u + .12, dpos = fixed + facing * .17;
        const [px, pz] = axis === 'x' ? [gu, dpos] : [dpos, gu];
        if (r() < .5) lathe(r() < .5 ? MAT.stoneware : MAT.terracotta, [[0, 0], [.05, 0], [.07, .1], [.03, .17], [.035, .2], [0, .2]], px, base, pz, 16);
        else trailing(px, base, pz, 1, axis === 'x' ? [0, facing] : [facing, 0]);
        u += .26; continue;
      }
      const bw = .022 + r() * .03, bh = .2 + r() * .1, bd = .16 + r() * .05;
      books.push({ u: u + bw / 2, y: base + bh / 2, w: bw, h: bh, d: bd, c: SPINES[Math.floor(r() * SPINES.length)] });
      u += bw + .002;
    }
  }
  const inst = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), M({ roughness: .7 }), books.length);
  const mtx = new THREE.Matrix4(), col = new THREE.Color();
  books.forEach((b, i) => {
    const dpos = fixed + facing * (.03 + b.d / 2);
    if (axis === 'x') mtx.compose(new THREE.Vector3(b.u, b.y, dpos), new THREE.Quaternion(), new THREE.Vector3(b.w, b.h, b.d));
    else mtx.compose(new THREE.Vector3(dpos, b.y, b.u), new THREE.Quaternion(), new THREE.Vector3(b.d, b.h, b.w));
    inst.setMatrixAt(i, mtx); inst.setColorAt(i, col.setHex(b.c));
  });
  inst.castShadow = true; inst.receiveShadow = true; world.add(inst);
}

  (g, w, h) => { g.fillStyle = '#ead9bd'; g.fillRect(0, 0, w, h); g.fillStyle = '#c89b45'; g.beginPath(); g.arc(w * .5, h * .55, w * .2, 0, 7); g.fill(); g.fillStyle = '#a8744a'; g.fillRect(0, h * .62, w, h * .38); g.fillStyle = '#6e4a2e'; g.fillRect(0, h * .8, w, h * .2); },
];
function art(i, x, y, z, w, h, face) {

// show the rings you can see from here, and the doorways on this floor

const DIRN = ['north', 'west', 'south', 'east'];

function jump(key) {

// walk along the graph from wherever you are to a node
function walkTo(target) {
  const start = here || nearestNode(camera.position);
  const steps = route(start, target);
  if (!steps) return;
  const pts = [camera.position.clone()];
  if (start !== here && start.p.distanceTo(camera.position.clone().setY(start.p.y)) > .2) pts.push(eyeAt(start));
  for (const { u, l } of steps) {
    if (l.path) for (const q of l.path) pts.push(q.clone().setY(q.y + EYE));
    pts.push(eyeAt(l.n));

  walking = { curve, t: 0, dur: Math.max(1.2, curve.getLength() / 1.9), to: target };

  if (e.key === 'Escape') menu.hidden = true;
});
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

/* ---------- frame loop ---------- */
const clock = new THREE.Clock();
let frameNo = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), .05);
  if (walking) {
    walking.t = Math.min(1, walking.t + dt / walking.dur);
    const e = walking.t < .5 ? 2 * walking.t * walking.t : 1 - Math.pow(-2 * walking.t + 2, 2) / 2;
    camera.position.copy(walking.curve.getPointAt(e));
    if (walking.endYaw !== undefined && walking.t > .55) yaw = lerpAngle(yaw, walking.endYaw, .08);
    else {
      const tan = walking.curve.getTangentAt(Math.min(.999, e + .02));
      if (Math.hypot(tan.x, tan.z) > .05) yaw = lerpAngle(yaw, Math.atan2(-tan.x, -tan.z), .08);
    }
    pitch *= .9;
    if (walking.t >= 1) { const to = walking.to; walking = null; arrive(to); }
  }
  camera.rotation.set(pitch, yaw, 0);
  if (!walking && ++frameNo % 10 === 0) updateTitle();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// ?room=kitchen opens straight into a room (handy for sharing a view); otherwise every visit starts at the front door
const startRoom = new URLSearchParams(location.search).get('room');
const hint = document.getElementById('hint');
frame();
window.__ready = true;
if (startRoom && STAND[startRoom]) {
  camera.position.copy(STAND[startRoom].pos); yaw = STAND[startRoom].yaw; pitch = STAND[startRoom].pitch || 0;
  arrive(null); renderMenu();
  document.getElementById('intro')?.remove();
  hint.style.opacity = 1; setTimeout(() => { hint.style.opacity = 0; }, 7000);
} else {
  camera.position.copy(P(716, 930, EYE)); yaw = 0; pitch = 0;   // just inside the front door
  arrive(null);
  window.openFrontDoor(() => {
    const n = nearestNode(STAND.foyer.pos);
    const curve = new THREE.CatmullRomCurve3([camera.position.clone(), P(716, 895, EYE), eyeAt(n)], false, 'centripetal');
    walking = { curve, t: 0, dur: 2, to: n, endYaw: STAND.foyer.yaw };
    refreshTargets();
    hint.style.opacity = 1;
    setTimeout(() => { hint.style.opacity = 0; }, 7000);
  });
}
</script>
</body>
