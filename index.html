<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dream Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6efe3;
    --ink: #3b2c22;
    --ink-soft: #7a6656;
    --accent: #b5532f;
    --line: #5a4636;
    --bar: rgba(30, 20, 14, .72);
    --bar-ink: #fbf4e8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background-color .6s ease;
  }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* ---------- Floor plan ---------- */
  #home {
    min-height: 100dvh;
    padding: 40px 16px 48px;
    background:
      radial-gradient(1200px 600px at 20% -10%, #fbf6ec 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 110%, #efe3cf 0%, transparent 60%),
      var(--paper);
  }
  .home-inner { max-width: 1080px; margin: 0 auto; }
  .eyebrow {
    font-size: 13px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--accent); margin: 0 0 10px;
  }
  h1 {
    font-family: "Fraunces", Georgia, serif; font-weight: 600;
    font-size: clamp(40px, 7vw, 68px); line-height: 1; margin: 0 0 14px;
  }
  .lede {
    font-family: "Fraunces", Georgia, serif; font-style: italic;
    font-size: clamp(17px, 2.2vw, 21px); color: var(--ink-soft);
    margin: 0 0 28px; max-width: 34em;
  }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .floors { display: inline-flex; background: #e9dcc6; border-radius: 999px; padding: 4px; }
  .floors button {
    border: 0; background: transparent; padding: 8px 18px; border-radius: 999px;
    cursor: pointer; font-size: 15px; color: var(--ink-soft);
  }
  .floors button[aria-pressed="true"] { background: #fffaf1; color: var(--ink); box-shadow: 0 1px 3px rgba(60,40,20,.15); }
  .start {
    border: 0; cursor: pointer; background: var(--accent); color: #fff8ef;
    padding: 12px 22px; border-radius: 999px; font-size: 16px; font-weight: 600;
    box-shadow: 0 6px 18px rgba(181,83,47,.3); transition: transform .15s ease;
  }
  .start:hover { transform: translateY(-1px); }
  .plan-card {
    background: #fffaf1; border-radius: 20px; padding: clamp(10px, 2.5vw, 28px);
    box-shadow: 0 1px 0 rgba(90,70,54,.08), 0 20px 50px -20px rgba(90,60,30,.25);
  }
  .plan-card svg { display: block; width: 100%; height: auto; }
  .plan-card .lbl { font-family: "Fraunces", Georgia, serif; font-size: 26px; fill: var(--ink); text-anchor: middle; pointer-events: none; }
  .plan-card .cnt { font-size: 15px; fill: var(--ink-soft); text-anchor: middle; pointer-events: none; letter-spacing: .03em; }
  .plan-card .muted .lbl { fill: #a8998a; font-style: italic; }
  .plan-card .live { cursor: pointer; outline: none; }
  .plan-card .live .shape { transition: filter .2s ease, stroke .2s ease; }
  .plan-card .live:hover .shape, .plan-card .live:focus-visible .shape { filter: brightness(1.06) saturate(1.15); stroke: var(--accent); stroke-width: 5; }
  .plan-card .live:hover .lbl, .plan-card .live:focus-visible .lbl { fill: var(--accent); }
  .hint { margin: 14px 4px 0; font-size: 14px; color: var(--ink-soft); }

  /* ---------- Tour ---------- */
  #tour { position: fixed; inset: 0; display: grid; grid-template-rows: 56px minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); }
  .bar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 0 16px; background: var(--bar); color: var(--bar-ink);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 5;
  }
  .bar button {
    background: transparent; border: 1px solid rgba(255,255,255,.25); color: var(--bar-ink);
    border-radius: 999px; padding: 7px 14px; cursor: pointer; font-size: 14px; white-space: nowrap;
  }
  .bar button:hover { background: rgba(255,255,255,.12); }
  .room-title { text-align: center; min-width: 0; }
  .room-title strong { display: block; font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .room-title span { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
  .found { font-size: 14px; opacity: .85; white-space: nowrap; }

  .stage-wrap { position: relative; overflow: hidden; min-width: 0; min-height: 0; }
  .stage { position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
  .stage.dragging { cursor: grabbing; }
  .pano { position: absolute; left: 0; will-change: transform; }
  .turn {
    position: absolute; top: 50%; z-index: 3; width: 46px; height: 46px; margin-top: -23px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.35); background: rgba(30,20,14,.55); color: #fbf4e8;
    font-size: 28px; line-height: 1; cursor: pointer; padding: 0 0 4px; backdrop-filter: blur(4px);
  }
  .turn:hover { background: rgba(30,20,14,.8); }
  .turn.left { left: 14px; } .turn.right { right: 14px; }
  .stage svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .stage.enter { animation: fadeIn .55s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: scale(1.015); } to { opacity: 1; transform: none; } }

  .spot {
    position: absolute; width: 38px; height: 38px; margin: -19px 0 0 -19px; border-radius: 50%;
    border: 2px solid #fffdf6; background: rgba(255, 246, 214, .35); cursor: pointer; padding: 0;
    box-shadow: 0 0 0 4px rgba(255, 220, 140, .25), 0 4px 14px rgba(0,0,0,.25);
    z-index: 2;
  }
  .spot::before { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: #fffdf6; }
  .spot::after {
    content: ""; position: absolute; inset: -2px; border-radius: 50%; border: 2px solid #fff4c9;
    animation: pulse 2s ease-out infinite;
  }
  .spot.done { background: #ffe58a; }
  .spot.done::before { inset: 11px; background: #b5532f; border-radius: 3px; transform: rotate(8deg); }
  .spot.done::after { animation: none; opacity: 0; }
  .spot:focus-visible { outline: 3px solid #ffe58a; outline-offset: 3px; }
  @keyframes pulse { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(2.1); opacity: 0; } }

  .note {
    position: absolute; z-index: 4; width: 250px; min-height: 150px;
    padding: 34px 22px 24px; font-family: "Kalam", cursive; font-size: 23px; line-height: 1.25;
    color: #3a2a1c; background: var(--c, #ffe58a);
    box-shadow: 0 1px 1px rgba(0,0,0,.08), 0 12px 24px -8px rgba(0,0,0,.4);
    transform: rotate(var(--r, -2deg)); transform-origin: top center;
    animation: stick .35s cubic-bezier(.2,1.4,.4,1);
  }
  .note::before {
    content: ""; position: absolute; top: -12px; left: 50%; width: 90px; height: 26px; margin-left: -45px;
    background: rgba(255, 255, 255, .55); box-shadow: 0 1px 2px rgba(0,0,0,.08); transform: rotate(-3deg);
  }
  .note::after {
    content: ""; position: absolute; right: 0; bottom: 0; width: 26px; height: 26px;
    background: linear-gradient(135deg, rgba(0,0,0,.0) 50%, rgba(0,0,0,.08) 50%);
  }
  .note .close {
    position: absolute; top: 6px; right: 8px; border: 0; background: transparent; cursor: pointer;
    font-size: 22px; line-height: 1; opacity: .45; padding: 4px;
  }
  .note .close:hover { opacity: .9; }
  @keyframes stick { from { opacity: 0; transform: rotate(var(--r)) translateY(-18px) scale(.85); } to { opacity: 1; transform: rotate(var(--r)); } }

  .door {
    position: absolute; z-index: 1; padding: 0; border: 0; cursor: pointer; background: transparent;
    border-radius: 3px 3px 0 0; transition: background-color .2s ease, box-shadow .2s ease;
  }
  .door:hover, .door:focus-visible {
    outline: none; background: rgba(255, 240, 200, .18);
    box-shadow: inset 0 0 0 3px #ffe58a, 0 0 40px rgba(255, 220, 140, .55);
  }
  .door .tag {
    position: absolute; left: 50%; top: 0; transform: translate(-50%, -125%);
    background: rgba(30, 20, 14, .8); color: #fbf4e8; font-size: 13px; line-height: 1;
    padding: 6px 11px; border-radius: 999px; white-space: nowrap; pointer-events: none;
    box-shadow: 0 2px 8px rgba(0,0,0,.25); transition: transform .2s ease, background-color .2s ease;
  }
  .door .tag::before { content: "🚪 "; }
  .door:hover .tag, .door:focus-visible .tag { background: #b5532f; transform: translate(-50%, -140%); }

  .first-hint {
    position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 3;
    background: rgba(30,20,14,.75); color: #fbf4e8; padding: 9px 16px; border-radius: 999px;
    font-size: 14px; pointer-events: none; animation: fadeIn .6s ease .4s both; white-space: nowrap;
  }

  /* SVG scene animation helpers */
  .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker .16s ease-in-out infinite alternate; }
  .flame.b { animation-duration: .21s; }
  .flame.c { animation-duration: .18s; animation-delay: .05s; }
  @keyframes flicker { from { transform: scale(1, 1) skewX(-2deg); } to { transform: scale(.92, 1.08) skewX(2deg); } }
  .glow { animation: glow 2.4s ease-in-out infinite alternate; }
  @keyframes glow { from { opacity: .55; } to { opacity: .85; } }
  .steam { animation: steam 3.2s ease-in-out infinite; opacity: 0; }
  .steam.b { animation-delay: 1.1s; }
  .steam.c { animation-delay: 2.1s; }
  @keyframes steam { 0% { transform: translateY(10px); opacity: 0; } 30% { opacity: .55; } 100% { transform: translateY(-50px); opacity: 0; } }
  .beam { animation: breathe 6s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: .22; } 50% { opacity: .42; } }
  .flutter { transform-box: fill-box; transform-origin: center; animation: flutter .3s ease-in-out infinite alternate; }
  @keyframes flutter { from { transform: scaleX(1); } to { transform: scaleX(.3); } }
  .drift { animation: drift 9s ease-in-out infinite alternate; }
  .drift.b { animation-duration: 12s; animation-delay: -4s; }
  @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(60px, -30px); } }
  .film { animation: film 7s ease-in-out infinite alternate; }
  @keyframes film { from { opacity: .9; } to { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  @media (max-width: 700px) {
    .note {
      position: fixed; left: 16px !important; right: 16px !important; top: auto !important;
      bottom: 20px !important; width: auto; margin: 0 auto; max-width: 360px;
    }
    .found { display: none; }
    .room-title strong { font-size: 17px; }
  }
</style>
</head>
<body>

<main id="home">
  <div class="home-inner">
    <p class="eyebrow">A walk through</p>
    <h1>My Dream Home</h1>
    <p class="lede">Every room holds something I'm growing toward. Pick a room on the plan, or take the tour from the courtyard.</p>
    <div class="controls">
      <div class="floors" role="group" aria-label="Floor">
        <button type="button" data-floor="ground" aria-pressed="true">Ground floor</button>
        <button type="button" data-floor="upper" aria-pressed="false">Upper floor</button>
      </div>
      <button class="start" type="button" id="startTour">Start the tour →</button>
    </div>
    <div class="plan-card" id="plan"></div>
    <p class="hint"><span style="display:inline-block;width:18px;height:6px;border-radius:2px;background:#b5532f;vertical-align:middle"></span> Doors are marked in terracotta. Tap a room to step inside; the stairs switch floors.</p>
  </div>
</main>

<section id="tour" hidden>
  <header class="bar">
    <button type="button" id="toMap">⌂ Floor plan</button>
    <div class="room-title"><strong id="roomName"></strong><span id="roomFloor"></span></div>
    <div class="found" id="foundCount"></div>
  </header>
  <div class="stage-wrap" id="stageWrap">
    <div class="stage" id="stage"></div>
  </div>
</section>

<script>
/* ============================================================
   Scene helpers
   ============================================================ */
function rng(seed) {
  let s = seed;
  return () => (s = (s * 16807) % 2147483647) / 2147483647;
}

const SPINES = ['#8e3b2e', '#c4813a', '#2f5f5a', '#d8c9a3', '#5a4a7a', '#a85a3a', '#3d5a80', '#7a8a4a', '#c9a04a', '#6a2f3a', '#e0d4b8', '#4a6b5a'];

function bookshelf(x0, y0, w, h, rows, seed) {
  const r = rng(seed);
  const rowH = h / rows;
  let out = `<rect x="${x0 - 12}" y="${y0 - 12}" width="${w + 24}" height="${h + 12}" fill="#4a2e1e"/>`;
  out += `<rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="#20160f"/>`;
  for (let i = 0; i < rows; i++) {
    const base = y0 + (i + 1) * rowH - 10;
    let x = x0 + 6;
    while (x < x0 + w - 24) {
      if (r() < 0.06) { x += 20 + r() * 30; continue; }
      const bw = 13 + r() * 16;
      const bh = rowH - 26 - r() * 34;
      const c = SPINES[Math.floor(r() * SPINES.length)];
      out += `<rect x="${x.toFixed(1)}" y="${(base - bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="${c}"/>`;
      if (r() < 0.5) out += `<rect x="${x.toFixed(1)}" y="${(base - bh + 10).toFixed(1)}" width="${bw.toFixed(1)}" height="3" fill="#000" opacity=".18"/>`;
      x += bw + 1.5;
    }
    out += `<rect x="${x0 - 12}" y="${base}" width="${w + 24}" height="12" fill="#5a3a26"/>`;
  }
  return out;
}

function rainStreaks() {
  const r = rng(7);
  let out = '';
  for (let i = 0; i < 14; i++) {
    const x = r() * 120, y = r() * 160;
    out += `<line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${(x - 4).toFixed(1)}" y2="${(y + 26).toFixed(1)}"/>`;
  }
  return out;
}

const flame = (x, y, cls = '') => `
  <path class="flame ${cls}" d="M${x} ${y - 30} Q${x + 11} ${y - 10} ${x} ${y} Q${x - 11} ${y - 10} ${x} ${y - 30}Z" fill="#ffc53d"/>
  <path class="flame ${cls}" d="M${x} ${y - 18} Q${x + 5} ${y - 6} ${x} ${y} Q${x - 5} ${y - 6} ${x} ${y - 18}Z" fill="#fff4b8"/>`;

// What you can see through a doorway: a small hint of the room beyond
function glimpse(type, x, y, w, h) {
  const r = (fx, fy, fw, fh, fill, extra = '') => `<rect x="${x + fx * w}" y="${y + fy * h}" width="${fw * w}" height="${fh * h}" fill="${fill}" ${extra}/>`;
  switch (type) {
    case 'atrium': return r(0, 0, 1, 1, '#e9d8b8') + r(0, 0, 1, .16, '#4a2a18') + r(0, .7, 1, .1, '#9a3526') + r(0, .8, 1, .2, '#f2e3c2') + r(.6, .16, .1, .64, '#5a3420') + r(0, .8, 1, .04, '#a59c8a');
    case 'kitchen': return r(0, 0, 1, 1, '#f3e6d0') + r(0, .55, 1, .1, '#dce8e3') + r(0, .65, 1, .35, '#5f7d6e') + r(0, .64, 1, .03, '#d9d2c5') +
      `<path d="M${x + w * .3} ${y + h * .3} Q${x + w * .5} ${y + h * .16} ${x + w * .7} ${y + h * .3}Z" fill="#c9962e"/><line x1="${x + w * .5}" y1="${y}" x2="${x + w * .5}" y2="${y + h * .2}" stroke="#3b2c22" stroke-width="2"/>`;
    case 'library': {
      let s = r(0, 0, 1, 1, '#20160f');
      for (let row = 0; row < 4; row++) {
        for (let i = 0; i < 8; i++) s += r(.05 + i * .115, .12 + row * .22, .1, .16 - (i % 3) * .02, SPINES[(i * 3 + row * 5) % SPINES.length], `transform="translate(0 ${((i % 3) * .02 * h).toFixed(1)})"`);
        s += r(0, .29 + row * .22, 1, .02, '#5a3a26');
      }
      return s;
    }
    case 'garden': return r(0, 0, 1, .6, '#bfe2f2') + r(0, .5, 1, .12, '#a9c99a') + r(0, .6, 1, .4, '#86b35c') +
      `<circle cx="${x + w * .72}" cy="${y + h * .2}" r="${w * .12}" fill="#fff4c2"/><ellipse cx="${x + w * .3}" cy="${y + h * .48}" rx="${w * .28}" ry="${h * .08}" fill="#5d8a46"/><rect x="${x + w * .28}" y="${y + h * .48}" width="${w * .04}" height="${h * .14}" fill="#7a5a3a"/>`;
    case 'stairsUp': {
      let s = r(0, 0, 1, 1, '#e8dcc8');
      for (let i = 0; i < 8; i++) s += r(i / 8, 1 - (i + 1) / 9, 1 - i / 8, 1 / 9, i % 2 ? '#c9b28d' : '#b49c74');
      return s + `<line x1="${x}" y1="${y + h * .7}" x2="${x + w}" y2="${y + h * .05}" stroke="#5a3420" stroke-width="5"/>`;
    }
    case 'stairsDown': {
      let s = r(0, 0, 1, 1, '#efe6da') + r(0, .55, 1, .45, '#7a6a5a');
      for (let i = 0; i < 6; i++) s += r(i / 6 * .7, .55 + i * .075, 1 - i / 6 * .7, .075, i % 2 ? '#c9b28d' : '#b49c74');
      return s + `<line x1="${x}" y1="${y + h * .45}" x2="${x + w}" y2="${y + h * .85}" stroke="#5a3420" stroke-width="5"/>`;
    }
    case 'study': return r(0, 0, 1, 1, '#dfe6dc') + r(.15, .15, .5, .3, '#cfe2ea') + r(0, .62, 1, .05, '#8b5a2b') + r(.1, .67, .06, .33, '#6b4226') + r(0, .9, 1, .1, '#9b7352');
    case 'master': return r(0, 0, 1, 1, '#f2dccf') + r(.2, .45, 1, .2, '#6b4a3a') + r(.25, .6, 1, .3, '#f7f3ec') + r(.25, .78, 1, .12, '#a9b7a4') + r(0, .9, 1, .1, '#9b6b4a');
    case 'open': return r(0, 0, 1, 1, '#f5efe6') + r(.2, .1, .6, .6, '#cfe6ee') + r(.48, .1, .04, .6, '#c9b49a') + r(0, .82, 1, .18, '#d9b98e');
    case 'closet': {
      let s = r(0, 0, 1, 1, '#5a3f30') + r(.05, .22, .9, .02, '#c9962e');
      ['#c24b3a', '#e3a83b', '#2f6f6a', '#f2a7c3', '#3d5a80'].forEach((c, i) => { s += r(.08 + i * .18, .25, .14, .3 + (i % 2) * .12, c); });
      return s + r(0, .9, 1, .1, '#b89a7a');
    }
  }
  return '';
}

// An open doorway: casing, a glimpse of the next room, and the door leaf swung inward.
// Defaults are modern classic (white casing, painted panel door); the Nalukettu passes carved wood.
function doorway(id, x, y, w, h, type, frame = '#f7f3ec', leaf = '#e4ddd0') {
  return `
  <clipPath id="dc-${id}"><rect x="${x}" y="${y}" width="${w}" height="${h}"/></clipPath>
  <rect x="${x - 14}" y="${y - 14}" width="${w + 28}" height="${h + 14}" fill="${frame}"/>
  <g clip-path="url(#dc-${id})">${glimpse(type, x, y, w, h)}</g>
  <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#000" opacity=".08"/>
  <polygon points="${x},${y} ${x + w * .2},${y + h * .05} ${x + w * .2},${y + h * .97} ${x},${y + h}" fill="${leaf}"/>
  <polygon points="${x + w * .04},${y + h * .1} ${x + w * .16},${y + h * .12} ${x + w * .16},${y + h * .45} ${x + w * .04},${y + h * .45}" fill="#000" opacity=".08"/>
  <polygon points="${x + w * .04},${y + h * .52} ${x + w * .16},${y + h * .52} ${x + w * .16},${y + h * .9} ${x + w * .04},${y + h * .92}" fill="#000" opacity=".08"/>
  <line x1="${x + w * .2}" y1="${y + h * .05}" x2="${x + w * .2}" y2="${y + h * .97}" stroke="#000" stroke-opacity=".15" stroke-width="2"/>
  <circle cx="${x + w * .17}" cy="${y + h * .55}" r="${Math.max(3, w * .025)}" fill="#c9962e"/>`;
}

/* ============================================================
   Scenes (viewBox 0 0 1600 900)
   ============================================================ */
// A closed (non-clickable) paneled door
function closedDoor(x, y, w, h, frame = '#f7f3ec', leaf = '#e4ddd0') {
  return `
  <rect x="${x - 14}" y="${y - 14}" width="${w + 28}" height="${h + 14}" fill="${frame}"/>
  <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${leaf}"/>
  <rect x="${x + w * .14}" y="${y + h * .07}" width="${w * .72}" height="${h * .36}" fill="#000" opacity=".07"/>
  <rect x="${x + w * .14}" y="${y + h * .5}" width="${w * .72}" height="${h * .42}" fill="#000" opacity=".07"/>
  <circle cx="${x + w * .84}" cy="${y + h * .55}" r="${Math.max(4, w * .035)}" fill="#c9962e"/>`;
}

const boards = (y, fill, line, gap = 28) => `
  <rect x="0" y="${y}" width="1600" height="${900 - y}" fill="${fill}"/>

const pottedPlant = (x, base, s = 1, pot = '#e8dfd2', leaf = '#4f7a3a') => `
  <g transform="translate(${x} ${base}) scale(${s})">
    <path d="M-46 0 l10 -80 h72 l10 80z" fill="${pot}"/>

  </g>`;

const frame = (x, y, w, h, color, inner) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${color}"/><rect x="${x + 10}" y="${y + 10}" width="${w - 20}" height="${h - 20}" fill="#f6efe3"/>${inner || ''}`;

function clock(cx, cy) {
  return `
  <circle cx="${cx}" cy="${cy}" r="72" fill="#8b5a2b"/>
  <circle cx="${cx}" cy="${cy}" r="62" fill="#fbf7ee"/>
  <g stroke="#3b2c22" stroke-width="3">${Array.from({ length: 12 }, (_, i) => {
    const a = i * Math.PI / 6;
    return `<line x1="${(cx + 50 * Math.sin(a)).toFixed(1)}" y1="${(cy - 50 * Math.cos(a)).toFixed(1)}" x2="${(cx + 56 * Math.sin(a)).toFixed(1)}" y2="${(cy - 56 * Math.cos(a)).toFixed(1)}"/>`;
  }).join('')}</g>
  <line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy - 48}" stroke="#3b2c22" stroke-width="5" stroke-linecap="round"/>
  <line x1="${cx}" y1="${cy}" x2="${(cx + 32 * Math.sin(5 * Math.PI / 6)).toFixed(1)}" y2="${(cy - 32 * Math.cos(5 * Math.PI / 6)).toFixed(1)}" stroke="#3b2c22" stroke-width="7" stroke-linecap="round"/>
  <circle cx="${cx}" cy="${cy}" r="6" fill="#b5532f"/>`;
}

}

      <text class="lbl" x="150" y="660" style="font-size:20px">Closet</text><text class="cnt" x="150" y="680" style="font-size:13px">${roomCount('closet')}</text>`)}
    ${live('master', `

      <rect x="276" y="560" width="150" height="160" rx="10" fill="#fffaf1" stroke="#d9b8a4" stroke-width="2"/>
      <rect x="276" y="640" width="150" height="80" rx="10" fill="#a9b7a4"/>

      <text class="lbl" x="351" y="486">Master Bedroom</text><text class="cnt" x="351" y="508">${roomCount('master')}</text>`)}

function renderPlan() {
  document.getElementById('plan').innerHTML = currentFloor === 'ground' ? groundPlan() : upperPlan();
  document.querySelectorAll('.floors button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.floor === currentFloor)));
}

function setFloor(f) { currentFloor = f; renderPlan(); }

/* ============================================================
   Tour: each room is a 360° panorama of its four walls.
   The strip is laid out W N E S W N so it can wrap seamlessly;
   heading 0 = facing north, 1 = east, 2 = south, 3 = west.
   ============================================================ */
const home = document.getElementById('home');
const tour = document.getElementById('tour');
const stage = document.getElementById('stage');
const DIRS = ['N', 'E', 'S', 'W'];
const DIR_NAMES = { N: 'north', E: 'east', S: 'south', W: 'west' };
const STRIP = ['W', 'N', 'E', 'S', 'W', 'N'];
let idx = 0;
let heading = 0;      // in walls; fractional while turning
let wallPx = 0;       // rendered width of one wall
let pano = null;
let hintShown = false;
let turnAnim = null;

function showHome() {
  tour.hidden = true; home.hidden = false;
  document.body.style.backgroundColor = '';
  currentFloor = ROOMS[idx].floor === 'Upper floor' ? 'upper' : 'ground';
  renderPlan();
  window.scrollTo(0, 0);
}

function go(i, fromId) {
  idx = i;
  const room = ROOMS[idx];
  const scene = SCENES[room.id];
  home.hidden = true; tour.hidden = false;
  document.body.style.backgroundColor = room.bg;
  stage.style.backgroundColor = room.bg;
  document.getElementById('roomName').textContent = room.name;

  // walking in through a door, you face into the room, away from that door
  const back = fromId && room.doors.find(d => d.to === fromId);
  heading = back ? (DIRS.indexOf(back.wall) + 2) % 4 : 0;

  const pct = (j, x) => ((j * 1600 + x) / 9600 * 100).toFixed(3);
  const corners = scene.corners ? `
    <linearGradient id="corner-l" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".22"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
    <linearGradient id="corner-r" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".22"/></linearGradient>` : '';
  const walls = STRIP.map((d, j) => `<g transform="translate(${j * 1600} 0)">${scene.walls[d]()}${scene.corners
    ? '<rect width="50" height="900" fill="url(#corner-l)"/><rect x="1550" width="50" height="900" fill="url(#corner-r)"/>' : ''}</g>`).join('');
  const buttons = STRIP.map((d, j) =>
    room.doors.filter(door => door.wall === d).map(door => {
      const label = door.label || ROOMS.find(r => r.id === door.to).name;
      return `<button class="door" style="left:${pct(j, door.x)}%;top:${door.y / 9}%;width:${(door.w / 96).toFixed(3)}%;height:${door.h / 9}%" data-to="${door.to}" aria-label="Go to ${label}"><span class="tag">${label}</span></button>`;
    }).join('') +
    room.notes.map((n, k) => n.wall !== d ? '' :
      `<button class="spot${found.has(`${room.id}-${k}`) ? ' done' : ''}" style="left:${pct(j, n.x)}%;top:${n.y / 9}%" data-k="${k}" aria-label="Read a note"></button>`).join('')
  ).join('');

  stage.innerHTML = `
    <div class="pano"><svg class="scene" viewBox="0 0 9600 900" preserveAspectRatio="none" aria-hidden="true"><defs>${scene.defs()}${corners}</defs>${walls}</svg>${buttons}</div>
    <button class="turn left" aria-label="Turn left">‹</button>
    <button class="turn right" aria-label="Turn right">›</button>
    ${!hintShown ? '<div class="first-hint">Drag to look around · tap glowing spots · walk through doors</div>' : ''}`;
  hintShown = true;
  pano = stage.querySelector('.pano');
  stage.classList.remove('enter'); void stage.offsetWidth; stage.classList.add('enter');
  layout();
  updateCount();
}

function layout() {
  if (!pano) return;
  const sw = stage.clientWidth, sh = stage.clientHeight;
  wallPx = Math.max(sh * 16 / 9, sw / 2);
  const ph = wallPx * 9 / 16;
  pano.style.width = `${wallPx * 6}px`;
  pano.style.height = `${ph}px`;
  pano.style.top = `${(sh - ph) / 2}px`;
  applyHeading();
}

function applyHeading() {
  heading = ((heading + .5) % 4 + 4) % 4 - .5;           // keep in [-0.5, 3.5)
  const offset = (1.5 + heading) * wallPx - stage.clientWidth / 2;
  pano.style.transform = `translate3d(${-offset}px, 0, 0)`;
  const facing = DIRS[((Math.round(heading) % 4) + 4) % 4];
  document.getElementById('roomFloor').textContent = `${ROOMS[idx].floor} · facing ${DIR_NAMES[facing]}`;
}

function turn(by) {
  closeNote();
  cancelAnimationFrame(turnAnim);
  const from = heading, to = Math.round(heading) + by, t0 = performance.now();
  const step = now => {
    const t = Math.min(1, (now - t0) / 420), e = 1 - Math.pow(1 - t, 3);
    heading = from + (to - from) * e;
    applyHeading();
    if (t < 1) turnAnim = requestAnimationFrame(step);
  };
  turnAnim = requestAnimationFrame(step);
}

function updateCount() {
  document.getElementById('foundCount').textContent = `${found.size} of ${TOTAL} notes found`;
}

function closeNote() {
  const n = stage.querySelector('.note');
  if (n) n.remove();
}

function openNote(spot) {
  closeNote();
  const k = +spot.dataset.k;
  const room = ROOMS[idx];
  const n = room.notes[k];
  found.add(`${room.id}-${k}`); save(); updateCount();
  stage.querySelectorAll(`.spot[data-k="${k}"]`).forEach(s => s.classList.add('done'));

  const el = document.createElement('div');
  el.className = 'note';
  el.dataset.k = k;
  el.setAttribute('role', 'dialog');
  el.style.setProperty('--c', n.c);
  el.style.setProperty('--r', `${n.r}deg`);
  const sr = stage.getBoundingClientRect(), pr = spot.getBoundingClientRect();
  const x = pr.left + pr.width / 2 - sr.left, y = pr.top + pr.height / 2 - sr.top;
  if (x > sr.width * .6) el.style.right = `${sr.width - x + 30}px`; else el.style.left = `${x + 30}px`;
  if (y > sr.height * .55) el.style.bottom = `${Math.max(10, sr.height - y - 20)}px`; else el.style.top = `${Math.max(10, y - 30)}px`;
  el.innerHTML = `<button class="close" aria-label="Close note">×</button>${n.text}`;
  stage.appendChild(el);
  el.querySelector('.close').focus({ preventScroll: true });
}

/* ============================================================
   Events
   ============================================================ */
document.getElementById('plan').addEventListener('click', e => {
  const t = e.target.closest('.live');
  if (!t) return;
  if (t.dataset.floor) return setFloor(t.dataset.floor);
  go(ROOMS.findIndex(r => r.id === t.dataset.room));
});
document.getElementById('plan').addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('.live')) { e.preventDefault(); e.target.closest('.live').dispatchEvent(new MouseEvent('click', { bubbles: true })); }
});
document.querySelectorAll('.floors button').forEach(b => b.addEventListener('click', () => setFloor(b.dataset.floor)));
document.getElementById('startTour').addEventListener('click', () => go(0));
document.getElementById('toMap').addEventListener('click', showHome);

// Drag (mouse or touch) to look around. Pointer capture only starts once
// it's clearly a drag, so plain taps still reach doors and notes.
let drag = null;
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('.note, .turn')) return;
  drag = { x: e.clientX, h: heading, moved: false, id: e.pointerId };
});
stage.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x;
  if (!drag.moved && Math.abs(dx) > 6) {
    drag.moved = true;
    cancelAnimationFrame(turnAnim);
    closeNote();
    stage.setPointerCapture(e.pointerId);
    stage.classList.add('dragging');
  }
  if (drag.moved) { heading = drag.h - dx / wallPx; applyHeading(); }
});
const endDrag = () => {
  if (drag && drag.moved) {
    stage.classList.remove('dragging');
    stage.addEventListener('click', ev => ev.stopPropagation(), { capture: true, once: true });
  }
  drag = null;
};
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);

// Trackpad / mouse wheel turns too
stage.addEventListener('wheel', e => {
  if (!pano) return;
  e.preventDefault();
  cancelAnimationFrame(turnAnim);
  closeNote();
  heading += (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) / wallPx;
  applyHeading();
}, { passive: false });

stage.addEventListener('click', e => {
  const t = e.target.closest('.turn');
  if (t) return turn(t.classList.contains('left') ? -1 : 1);
  const door = e.target.closest('.door');
  if (door) return go(ROOMS.findIndex(r => r.id === door.dataset.to), ROOMS[idx].id);
  const spot = e.target.closest('.spot');
  if (spot) {
    const open = stage.querySelector('.note');
    if (open && open.dataset.k === spot.dataset.k) return closeNote();
    return openNote(spot);
  }
  if (e.target.closest('.close') || !e.target.closest('.note')) closeNote();
});

document.addEventListener('keydown', e => {
  if (tour.hidden) return;
  if (e.key === 'Escape') closeNote();
  if (e.key === 'ArrowLeft') turn(-1);
  if (e.key === 'ArrowRight') turn(1);
});
window.addEventListener('resize', layout);

renderPlan();
// deep links like #garden (or #garden-east) open straight into that room
const [startRoom, startDir] = location.hash.slice(1).split('-');
const startAt = ROOMS.findIndex(r => r.id === startRoom);
if (startAt >= 0) {
  go(startAt);
  const d = Object.keys(DIR_NAMES).find(k => DIR_NAMES[k] === startDir);
  if (d) { heading = DIRS.indexOf(d); applyHeading(); }
}
</script>
