<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Future Boardwalk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe6f4; color: #2f241c;
    font-family: ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  svg { display: block; width: 100%; height: 100%; }
  .top { position: absolute; left: 16px; right: 16px; top: max(5vh, 20px); text-align: center; pointer-events: none; transition: opacity .4s ease; }
  .top p { margin: 0 0 6px; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: #8a3b1e; }
  .top h1 { margin: 0; font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: clamp(34px, 6vw, 64px); line-height: 1; }
  .top span { display: block; margin-top: 10px; font-family: "Fraunces", Georgia, serif; font-style: italic; font-size: 18px; color: #4a3a2e; }
  a.house { cursor: pointer; outline: none; }
  a.house .halo { opacity: 0; transition: opacity .3s ease; }
  a.house .sign { transition: transform .3s ease; transform-box: fill-box; transform-origin: center bottom; }
  a.house:hover .halo, a.house:focus-visible .halo { opacity: 1; }
  a.house:hover .sign, a.house:focus-visible .sign { transform: translateY(-6px); }
  .sign text { font-family: "Fraunces", Georgia, serif; font-weight: 600; }
  body.going .top { opacity: 0; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
</style>
</head>
<body>
<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A street with two houses side by side">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fb6e0"/><stop offset=".7" stop-color="#d4e7ef"/><stop offset="1" stop-color="#eef2e8"/></linearGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fb262"/><stop offset="1" stop-color="#6a9446"/></linearGradient>
    <radialGradient id="sun"><stop offset="0" stop-color="#fffbe6"/><stop offset=".3" stop-color="#fff2b8" stop-opacity=".8"/><stop offset="1" stop-color="#fff2b8" stop-opacity="0"/></radialGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#fff2c4" stop-opacity=".95"/><stop offset="1" stop-color="#fff2c4" stop-opacity="0"/></radialGradient>
    <!-- the dream home's materials -->
    <pattern id="dh-tiles" width="24" height="16" patternUnits="userSpaceOnUse">
      <rect width="24" height="16" fill="#b4552f"/><path d="M0 16 Q6 7 12 16 Q18 7 24 16" fill="#c96a3e" stroke="#8a3b1e" stroke-width="1.5"/>
    </pattern>
    <pattern id="dh-siding" width="40" height="18" patternUnits="userSpaceOnUse">
      <rect width="40" height="18" fill="#f4f1ea"/><rect y="16" width="40" height="2" fill="#dcd6ca"/>
    </pattern>
    <!-- Mama House's materials -->
    <pattern id="mh-cedar" width="22" height="40" patternUnits="userSpaceOnUse">
      <rect width="22" height="40" fill="#a8744a"/><rect width="2" height="40" fill="#7d5233"/><rect x="9" width="1" height="40" fill="#b8865a" opacity=".6"/>
    </pattern>
    <pattern id="mh-lime" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="#e8ddcb"/><circle cx="12" cy="18" r="9" fill="#e1d4bf" opacity=".6"/><circle cx="44" cy="42" r="12" fill="#efe6d8" opacity=".7"/>
    </pattern>
  </defs>

  <g id="scene">
    <rect width="1600" height="900" fill="url(#sky)"/>
    <circle cx="1400" cy="130" r="170" fill="url(#sun)"/><circle cx="1400" cy="130" r="40" fill="#fffbe6"/>
    <g fill="#fff" opacity=".85"><ellipse cx="260" cy="180" rx="100" ry="24"/><ellipse cx="315" cy="164" rx="64" ry="28"/><ellipse cx="1080" cy="250" rx="80" ry="20"/><ellipse cx="1120" cy="236" rx="50" ry="22"/></g>
    <path d="M0 600 Q220 520 460 575 T940 560 T1360 555 T1600 575 V680 H0Z" fill="#a9b98c"/>
    <g fill="#86a46c"><circle cx="40" cy="600" r="64"/><circle cx="1560" cy="600" r="70"/><circle cx="760" cy="610" r="50"/><circle cx="820" cy="600" r="60"/></g>
    <rect y="640" width="1600" height="160" fill="url(#lawn)"/>

    <!-- sidewalk, curb and street -->
    <rect y="760" width="1600" height="32" fill="#d9d2c4"/>
    <g stroke="#c4bcad" stroke-width="2">
      <line x1="100" y1="760" x2="100" y2="792"/><line x1="300" y1="760" x2="300" y2="792"/><line x1="500" y1="760" x2="500" y2="792"/><line x1="700" y1="760" x2="700" y2="792"/>
      <line x1="900" y1="760" x2="900" y2="792"/><line x1="1100" y1="760" x2="1100" y2="792"/><line x1="1300" y1="760" x2="1300" y2="792"/><line x1="1500" y1="760" x2="1500" y2="792"/>
    </g>
    <rect y="792" width="1600" height="8" fill="#b9b1a2"/>
    <rect y="800" width="1600" height="100" fill="#5c5853"/>
    <g fill="#e9e1cf"><rect x="40" y="846" width="90" height="6" rx="3"/><rect x="240" y="846" width="90" height="6" rx="3"/><rect x="440" y="846" width="90" height="6" rx="3"/><rect x="640" y="846" width="90" height="6" rx="3"/><rect x="840" y="846" width="90" height="6" rx="3"/><rect x="1040" y="846" width="90" height="6" rx="3"/><rect x="1240" y="846" width="90" height="6" rx="3"/><rect x="1440" y="846" width="90" height="6" rx="3"/></g>

    <!-- a shade tree between the two lots -->
    <g id="midtree"></g>

    <!-- ============ My Dream Home ============ -->
    <a class="house" id="dream" href="dream-home.html" aria-label="Visit My Dream Home">
      <ellipse class="halo" cx="406" cy="560" rx="330" ry="210" fill="url(#halo)"/>
      <path d="M396 650 L416 650 L452 760 L360 760Z" fill="#d9cdb6"/>
      <g transform="translate(70.2 356) scale(.42)">
        <ellipse cx="800" cy="702" rx="640" ry="14" fill="#000" opacity=".12"/>
        <!-- upper floor, set back: white siding, black windows, flat roof with a white cornice -->
        <rect x="360" y="300" width="880" height="180" fill="url(#dh-siding)"/>
        <rect x="350" y="286" width="900" height="16" fill="#ffffff"/>
        <rect x="350" y="300" width="900" height="6" fill="#000" opacity=".08"/>
        <g id="dh-upwin"></g>
        <!-- ground-floor wings -->
        <rect x="200" y="470" width="420" height="230" fill="url(#dh-siding)"/>
        <rect x="190" y="458" width="440" height="14" fill="#ffffff"/>
        <rect x="980" y="470" width="400" height="230" fill="url(#dh-siding)"/>
        <rect x="970" y="458" width="420" height="14" fill="#ffffff"/>
        <g id="dh-lowwin"></g>
        <!-- the Nalukettu's entrance: lime-plastered wall under a terracotta roof -->
        <rect x="600" y="440" width="400" height="260" fill="#efe3cc"/>
        <rect x="600" y="680" width="400" height="20" fill="#a6503a"/>
        <polygon points="556,454 1044,454 962,336 638,336" fill="url(#dh-tiles)"/>
        <rect x="634" y="328" width="332" height="12" fill="#7a3218"/>
        <rect x="552" y="450" width="496" height="14" fill="#4a2a18"/>
        <rect x="600" y="464" width="400" height="22" fill="#000" opacity=".14"/>
        <path d="M638 330 l-10 -18 l10 6z M962 330 l10 -18 l-10 6z" fill="#d4a23a"/>
        <line x1="672" y1="464" x2="672" y2="540" stroke="#b88a22" stroke-width="2"/><path d="M656 540 Q672 556 688 540Z" fill="#d4a23a"/>
        <line x1="928" y1="464" x2="928" y2="540" stroke="#b88a22" stroke-width="2"/><path d="M912 540 Q928 556 944 540Z" fill="#d4a23a"/>
        <!-- carved teak frame and the closed door -->
        <rect x="712" y="502" width="176" height="198" fill="#6b4226"/>
        <path d="M706 504 Q800 466 894 504Z" fill="#5a3420"/>
        <circle cx="800" cy="490" r="6" fill="#d4a23a"/>
        <rect x="730" y="520" width="69" height="180" fill="#4a2a18"/><rect x="801" y="520" width="69" height="180" fill="#4a2a18"/>
        <g fill="#3e2314"><rect x="738" y="528" width="53" height="72"/><rect x="738" y="616" width="53" height="76"/><rect x="809" y="528" width="53" height="72"/><rect x="809" y="616" width="53" height="76"/></g>
        <g id="dh-studs" fill="#d4a23a"></g>
        <rect x="700" y="700" width="200" height="12" fill="#d6cdbb"/>
        <rect x="684" y="712" width="232" height="12" fill="#c9c0ae"/>
        <!-- plants by the door -->
        <path d="M612 700 l8 -50 h44 l8 50z" fill="#b5532f"/>
        <g fill="#4f7a3a"><ellipse cx="642" cy="630" rx="20" ry="34"/><ellipse cx="624" cy="642" rx="14" ry="26" transform="rotate(-25 624 642)"/><ellipse cx="660" cy="640" rx="14" ry="26" transform="rotate(25 660 640)" fill="#6a9a4a"/></g>
        <path d="M928 700 l8 -50 h44 l8 50z" fill="#b5532f"/>
        <g fill="#4f7a3a"><ellipse cx="958" cy="630" rx="20" ry="34"/><ellipse cx="940" cy="642" rx="14" ry="26" transform="rotate(-25 940 642)" fill="#6a9a4a"/><ellipse cx="976" cy="640" rx="14" ry="26" transform="rotate(25 976 640)"/></g>
        <g id="dh-shrubs"></g>
      </g>
      <!-- name sign on the lawn -->
      <g class="sign">
        <rect x="236" y="700" width="6" height="52" fill="#6b5233"/><rect x="330" y="700" width="6" height="52" fill="#6b5233"/>
        <rect x="198" y="672" width="176" height="40" rx="6" fill="#fbf4e8" stroke="#6b5233" stroke-width="3"/>
        <text x="286" y="699" text-anchor="middle" font-size="19" fill="#3b2c22">My Dream Home</text>
      </g>
    </a>

    <!-- ============ Mama House ============ -->
    <a class="house" id="mama" href="mama-house.html" aria-label="Visit Mama House">
      <ellipse class="halo" cx="1108" cy="555" rx="340" ry="215" fill="url(#halo)"/>
      <path d="M1098 650 L1118 650 L1156 760 L1060 760Z" fill="#d9cdb6"/>
      <g transform="translate(821 356) scale(.42)">
        <ellipse cx="800" cy="702" rx="640" ry="14" fill="#000" opacity=".12"/>
        <!-- upper floor in cedar boards, ground floor in limewash, flat roof -->
        <rect x="200" y="222" width="1200" height="228" fill="url(#mh-cedar)"/>
        <rect x="188" y="206" width="1224" height="18" fill="#4b3f35"/>
        <rect x="200" y="224" width="1200" height="6" fill="#000" opacity=".12"/>
        <rect x="200" y="446" width="1200" height="8" fill="#5b4a3c"/>
        <rect x="200" y="454" width="1200" height="246" fill="url(#mh-lime)"/>
        <rect x="200" y="692" width="1200" height="8" fill="#b8a68c"/>
        <g id="mh-win"></g>
        <!-- front door under a small oak canopy, closed -->
        <rect x="596" y="484" width="174" height="12" fill="#6b5138"/>
        <rect x="612" y="496" width="142" height="204" fill="#5c4330"/>
        <rect x="620" y="503" width="62" height="197" fill="#8a5f3c"/><rect x="684" y="503" width="62" height="197" fill="#8a5f3c"/>
        <g fill="#6e4a2e"><rect x="632" y="509" width="2" height="185"/><rect x="645" y="509" width="2" height="185"/><rect x="657" y="509" width="2" height="185"/><rect x="709" y="509" width="2" height="185"/><rect x="721" y="509" width="2" height="185"/><rect x="734" y="509" width="2" height="185"/></g>
        <rect x="673" y="574" width="4" height="56" fill="#2a2420"/><rect x="689" y="574" width="4" height="56" fill="#2a2420"/>
        <rect x="604" y="700" width="158" height="10" fill="#d3cabb"/>
        <rect x="592" y="710" width="182" height="10" fill="#c6bdae"/>
        <!-- potted olive trees by the door -->
        <path d="M548 700 l8 -48 h40 l8 48z" fill="#b5532f"/>
        <path d="M574 652 C572 620 578 600 576 580" stroke="#6f6252" stroke-width="5" fill="none"/>
        <g fill="#8c9a6e"><ellipse cx="576" cy="568" rx="30" ry="22"/><ellipse cx="556" cy="584" rx="18" ry="13"/><ellipse cx="598" cy="582" rx="18" ry="13" fill="#a4ad84"/></g>
        <path d="M762 700 l8 -48 h40 l8 48z" fill="#b5532f"/>
        <path d="M790 652 C792 620 786 600 788 580" stroke="#6f6252" stroke-width="5" fill="none"/>
        <g fill="#8c9a6e"><ellipse cx="788" cy="568" rx="30" ry="22"/><ellipse cx="768" cy="582" rx="18" ry="13" fill="#a4ad84"/><ellipse cx="810" cy="584" rx="18" ry="13"/></g>
        <g id="mh-shrubs"></g>
      </g>
      <g class="sign">
        <rect x="1236" y="700" width="6" height="52" fill="#6b5233"/><rect x="1330" y="700" width="6" height="52" fill="#6b5233"/>
        <rect x="1214" y="672" width="144" height="40" rx="6" fill="#fbf4e8" stroke="#6b5233" stroke-width="3"/>
        <text x="1286" y="699" text-anchor="middle" font-size="19" fill="#3b2c22">Mama House</text>
      </g>
    </a>

    <!-- street trees in front -->
    <g id="fronttrees"></g>
  </g>
</svg>
<div class="top">
  <p>Future Boardwalk</p>
  <h1>Pick a house</h1>
  <span>Click one to walk inside</span>
</div>
<script>
(() => {
  const NS = (tag, attrs) => `<${tag} ${Object.entries(attrs).map(([k, v]) => `${k}="${v}"`).join(' ')}/>`;
  const $ = id => document.getElementById(id);

  // the dream home: white-framed windows, brass studs on the door, shrubs
  const dhWin = (x, y, w, h) => NS('rect', { x: x - 8, y: y - 8, width: w + 16, height: h + 16, fill: '#ffffff' }) + NS('rect', { x, y, width: w, height: h, fill: '#2b2d31' }) +
    NS('rect', { x: x + 6, y: y + 6, width: w - 12, height: h - 12, fill: '#cfe2ea' }) + NS('path', { d: `M${x + 14} ${y + h - 20} L${x + w * .5} ${y + 14}`, stroke: '#fff', 'stroke-width': 6, opacity: .5 }) +
    NS('rect', { x: x + w / 2 - 3, y, width: 6, height: h, fill: '#2b2d31' }) + NS('rect', { x, y: y + h * .45 - 3, width: w, height: 6, fill: '#2b2d31' });
  $('dh-upwin').innerHTML = [400, 1080].map(x => dhWin(x, 334, 120, 110)).join('');
  $('dh-lowwin').innerHTML = dhWin(260, 526, 120, 120) + dhWin(450, 526, 120, 120) + dhWin(1040, 526, 140, 120) + dhWin(1240, 526, 90, 120);
  let studs = '';
  for (const x0 of [730, 801]) for (const u of [.22, .5, .78]) for (const v of [.1, .24, .38, .62, .76, .9]) studs += NS('circle', { cx: x0 + u * 69, cy: 520 + v * 180, r: 3.2 });
  $('dh-studs').innerHTML = studs;
  const shrub = (x, r, c) => NS('ellipse', { cx: x, cy: 700, rx: r, ry: r * .7, fill: c });
  $('dh-shrubs').innerHTML = [220, 300, 380, 460, 540, 1060, 1140, 1220, 1300, 1370].map((x, i) => shrub(x, 46 + (i % 3) * 6, i % 2 ? '#4f7a3a' : '#5d8a46')).join('');

  // Mama House: dark-framed windows with oak sills, a plant on the kitchen sill
  const mhWin = (x, y, w, h) => {
    let s = NS('rect', { x: x - 6, y: y - 6, width: w + 12, height: h + 12, fill: '#2f2a25' }) + NS('rect', { x, y, width: w, height: h, fill: '#c6d7d9' }) +
      NS('path', { d: `M${x + 16} ${y + h - 18} L${x + w * .4} ${y + 14}`, stroke: '#fff', 'stroke-width': 8, opacity: .4 });
    const n = Math.max(1, Math.round(w / 110));
    for (let i = 1; i < n; i++) s += NS('rect', { x: x + w * i / n - 3, y, width: 6, height: h, fill: '#2f2a25' });
    return s + NS('rect', { x: x - 10, y: y + h + 6, width: w + 20, height: 6, fill: '#8a6440' });
  };
  $('mh-win').innerHTML = mhWin(244, 511, 205, 148) + mhWin(1083, 511, 209, 103) + mhWin(650, 261, 281, 132) + mhWin(1113, 261, 260, 132) +
    NS('path', { d: 'M1110 614 l3 -16 h14 l3 16z', fill: '#b5532f' }) + NS('ellipse', { cx: 1120, cy: 590, rx: 12, ry: 10, fill: '#5f7d4a' });
  $('mh-shrubs').innerHTML = [230, 300, 480, 860, 940, 1010, 1330, 1385].map((x, i) => shrub(x, 40 + (i % 3) * 6, i % 2 ? '#5f7d4a' : '#6d8a52')).join('');

  const tree = (x, y, k) => `<path d="M${x} ${y} C${x - 6} ${y - 90 * k} ${x + 8} ${y - 150 * k} ${x} ${y - 200 * k}" stroke="#6b5233" stroke-width="${24 * k}" fill="none" stroke-linecap="round"/>
    <g transform="translate(${x} ${y - 260 * k}) scale(${k})"><circle cx="-80" cy="30" r="90" fill="#5f7d4a"/><circle cx="80" cy="30" r="90" fill="#5f7d4a"/><circle cx="0" cy="-30" r="110" fill="#6d8a52"/><circle cx="-40" cy="-60" r="60" fill="#7f9a62"/><circle cx="50" cy="0" r="66" fill="#7f9a62"/></g>`;
  $('midtree').innerHTML = tree(760, 660, .62);
  $('fronttrees').innerHTML = tree(40, 800, .75) + tree(1565, 805, .8);

  /* ---------- click a house: zoom in until its front fills the screen, then go inside ----------
     Each house is drawn at 0.42 of its own landing-page size, so scaling the street by 1/0.42 around
     the house lines it up exactly with the front you see when its page opens. */
  const scene = $('scene');
  const HOUSES = { dream: { tx: 70.2, ty: 356 }, mama: { tx: 821, ty: 356 } };
  const K = .42;
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  let going = false;
  for (const [id, h] of Object.entries(HOUSES)) {
    $(id).addEventListener('click', e => {
      e.preventDefault();
      if (going) return; going = true;
      const href = $(id).getAttribute('href');
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) { location.href = href; return; }
      document.body.classList.add('going');
      const s1 = 1 / K, ox = -h.tx / K, oy = -h.ty / K, t0 = performance.now(), ms = 1700;
      const step = now => {
        const t = Math.min(1, (now - t0) / ms), e = ease(t);
        const s = 1 + (s1 - 1) * e;
        scene.setAttribute('transform', `translate(${(ox * e).toFixed(2)} ${(oy * e).toFixed(2)}) scale(${s.toFixed(4)})`);
        if (t < 1) requestAnimationFrame(step); else location.href = href;
      };
      requestAnimationFrame(step);
    });
  }
  // coming back to the street resets the view
  addEventListener('pageshow', () => { going = false; scene.removeAttribute('transform'); document.body.classList.remove('going'); });
})();
</script>
</body>
</html>
