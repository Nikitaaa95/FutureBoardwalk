<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root { --bar: rgba(30, 20, 14, .72); --bar-ink: #fbf4e8; --accent: #b5532f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1411; color: #3b2c22;
    font-family: ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  #view { position: fixed; inset: 0; touch-action: none; cursor: grab; }
  #view.dragging { cursor: grabbing; }
  #view canvas { display: block; width: 100%; height: 100%; }

  .bar {
    position: fixed; left: 0; right: 0; top: 0; height: 56px; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px;
    background: var(--bar); color: var(--bar-ink); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .bar button {
    background: transparent; border: 1px solid rgba(255,255,255,.25); color: var(--bar-ink);
    border-radius: 999px; padding: 7px 14px; cursor: pointer; font-size: 14px; white-space: nowrap;
  }
  .bar button:hover { background: rgba(255,255,255,.12); }
  .bar .left { display: flex; gap: 8px; flex-shrink: 0; }
  .bar a.street { border: 1px solid rgba(255,255,255,.25); color: var(--bar-ink); border-radius: 999px; padding: 7px 14px; font-size: 14px; white-space: nowrap; text-decoration: none; }
  .bar a.street:hover { background: rgba(255,255,255,.12); }
  .room-title { text-align: center; min-width: 0; }
  .room-title strong { display: block; font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .room-title span { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
  .found { font-size: 14px; opacity: .85; white-space: nowrap; }

  #menu {
    position: fixed; top: 64px; left: 16px; z-index: 11; width: 240px; padding: 8px;
    background: rgba(30,20,14,.88); color: var(--bar-ink); border-radius: 14px; backdrop-filter: blur(8px);
  }
  #menu h3 { margin: 8px 10px 4px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; opacity: .6; font-weight: 600; }
  #menu button { display: block; width: 100%; text-align: left; background: transparent; border: 0; color: inherit;
    padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 15px; }
  #menu button:hover { background: rgba(255,255,255,.1); }
  #menu button.here { color: #ffe58a; }

  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
  .spot {
    position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer; will-change: transform;
  }
  .spot {
    width: 38px; height: 38px; margin: -19px 0 0 -19px; border-radius: 50%; padding: 0;
    border: 2px solid #fffdf6; background: rgba(255, 246, 214, .35);
    box-shadow: 0 0 0 4px rgba(255, 220, 140, .25), 0 4px 14px rgba(0,0,0,.35);
  }
  .spot::before { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: #fffdf6; }
  .spot::after { content: ""; position: absolute; inset: -2px; border-radius: 50%; border: 2px solid #fff4c9; animation: pulse 2s ease-out infinite; }
  .spot.done { background: #ffe58a; }
  .spot.done::before { inset: 11px; background: #b5532f; border-radius: 3px; transform: rotate(8deg); }
  .spot.done::after { animation: none; opacity: 0; }
  @keyframes pulse { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(2.1); opacity: 0; } }

  .note {
    position: fixed; z-index: 8; width: 250px; min-height: 150px;
    padding: 34px 22px 24px; font-family: "Kalam", cursive; font-size: 23px; line-height: 1.25;
    color: #3a2a1c; background: var(--c, #ffe58a);
    box-shadow: 0 1px 1px rgba(0,0,0,.08), 0 12px 24px -8px rgba(0,0,0,.5);
    transform: rotate(var(--r, -2deg)); transform-origin: top center; animation: stick .35s cubic-bezier(.2,1.4,.4,1);
  }
  .note::before { content: ""; position: absolute; top: -12px; left: 50%; width: 90px; height: 26px; margin-left: -45px;
    background: rgba(255, 255, 255, .55); box-shadow: 0 1px 2px rgba(0,0,0,.08); transform: rotate(-3deg); }
  .note .close { position: absolute; top: 6px; right: 8px; border: 0; background: transparent; cursor: pointer; font-size: 22px; line-height: 1; opacity: .45; padding: 4px; }
  @keyframes stick { from { opacity: 0; transform: rotate(var(--r)) translateY(-18px) scale(.85); } to { opacity: 1; transform: rotate(var(--r)); } }

  .hint {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 6; opacity: 0;
    background: rgba(30,20,14,.75); color: #fbf4e8; padding: 9px 16px; border-radius: 999px; font-size: 14px; pointer-events: none;
    white-space: nowrap; transition: opacity .6s ease;
  }
  #fade { position: fixed; inset: 0; background: #120d0a; z-index: 20; pointer-events: none; opacity: 0; transition: opacity .35s ease; }
  #intro { position: fixed; inset: 0; z-index: 30; background: #cfe6f4; }
  #intro svg { display: block; width: 100%; height: 100%; }
  .intro-text { position: absolute; left: 16px; right: 16px; top: max(5vh, 20px); text-align: center; color: #2f241c; pointer-events: none; transition: opacity .5s ease; }
  .intro-eyebrow { margin: 0 0 6px; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: #8a3b1e; }
  .intro-text h1 { margin: 0 0 10px; font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: clamp(38px, 6.5vw, 72px); line-height: 1; }
  #introStatus { margin: 0; font-family: "Fraunces", Georgia, serif; font-style: italic; font-size: 19px; color: #4a3a2e; }
  #introStatus.loading::after { content: ""; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.4s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  @media (max-width: 700px) {
    .found { display: none; }
    .note { left: 16px !important; right: 16px !important; top: auto !important; bottom: 20px !important; width: auto; margin: 0 auto; max-width: 360px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<script>
// Draws the parts of the front that repeat, and swings the door open once the 3D house is ready.
(() => {
  const NS = (tag, attrs) => `<${tag} ${Object.entries(attrs).map(([k, v]) => `${k}="${v}"`).join(' ')}/>`;
  const win = (x, y, w, h) => NS('rect', { x: x - 8, y: y - 8, width: w + 16, height: h + 16, fill: '#ffffff' }) + NS('rect', { x, y, width: w, height: h, fill: '#2b2d31' }) +
    NS('rect', { x: x + 6, y: y + 6, width: w - 12, height: h - 12, fill: '#cfe2ea' }) + NS('path', { d: `M${x + 14} ${y + h - 20} L${x + w * .5} ${y + 14}`, stroke: '#fff', 'stroke-width': 6, opacity: .5 }) +
    NS('rect', { x: x + w / 2 - 3, y, width: 6, height: h, fill: '#2b2d31' }) + NS('rect', { x, y: y + h * .45 - 3, width: w, height: 6, fill: '#2b2d31' });
  document.getElementById('in-upwin').innerHTML = [400, 1080].map(x => win(x, 334, 120, 110)).join('');
  document.getElementById('in-lowwin').innerHTML = win(260, 526, 120, 120) + win(450, 526, 120, 120) + win(1040, 526, 140, 120) + win(1240, 526, 90, 120);
  const shrub = (x, r, c) => NS('ellipse', { cx: x, cy: 700, rx: r, ry: r * .7, fill: c });
  document.getElementById('in-shrubs').innerHTML = [220, 300, 380, 460, 540, 1060, 1140, 1220, 1300, 1370].map((x, i) => shrub(x, 46 + (i % 3) * 6, i % 2 ? '#4f7a3a' : '#5d8a46')).join('');
  const tree = (x, y, k) => `<path d="M${x} ${y} C${x - 6} ${y - 90 * k} ${x + 8} ${y - 150 * k} ${x} ${y - 200 * k}" stroke="#6b5233" stroke-width="${24 * k}" fill="none" stroke-linecap="round"/>
    <g transform="translate(${x} ${y - 260 * k}) scale(${k})"><circle cx="-80" cy="30" r="90" fill="#4f7a3a"/><circle cx="80" cy="30" r="90" fill="#4f7a3a"/><circle cx="0" cy="-30" r="110" fill="#5d8a46"/><circle cx="-40" cy="-60" r="60" fill="#6a9a4a"/><circle cx="50" cy="0" r="66" fill="#6a9a4a"/></g>`;
  document.getElementById('in-trees').innerHTML = tree(90, 760, 1.25) + tree(1520, 770, 1.3);

  // Door leaves, drawn in perspective: each leaf swings inward on its hinge
  const TOP = 520, BOT = 700, MID = 610, W = 70;
  const leaves = [{ g: document.getElementById('leafL'), hinge: 730, dir: 1 }, { g: document.getElementById('leafR'), hinge: 870, dir: -1 }];
  const studs = [];
  for (const u of [.22, .5, .78]) for (const v of [.1, .24, .38, .62, .76, .9]) studs.push([u, v]);
  function drawLeaf(l, th) {
    const cos = Math.cos(th), sin = Math.sin(th), s = 1 - .22 * sin;   // the far edge shrinks as it swings away
    const map = (u, v) => {
      const x = l.hinge + l.dir * u * W * cos;
      const top = TOP + (MID - (MID - TOP) * s - TOP) * u, bot = BOT + (MID + (BOT - MID) * s - BOT) * u;
      return [x, top + (bot - top) * v];
    };
    const poly = pts => pts.map(p => map(...p).map(n => n.toFixed(1)).join(',')).join(' ');
    let out = NS('polygon', { points: poly([[0, 0], [1, 0], [1, 1], [0, 1]]), fill: '#4a2a18' });
    out += NS('polygon', { points: poly([[.12, .05], [.88, .05], [.88, .46], [.12, .46]]), fill: '#3e2314' });
    out += NS('polygon', { points: poly([[.12, .54], [.88, .54], [.88, .95], [.12, .95]]), fill: '#3e2314' });
    for (const [u, v] of studs) { const [x, y] = map(u, v); out += NS('ellipse', { cx: x.toFixed(1), cy: y.toFixed(1), rx: (3.2 * Math.max(cos, .2) * (1 - .2 * u * sin)).toFixed(2), ry: (3.2 * (1 - .2 * u * sin)).toFixed(2), fill: '#d4a23a' }); }
    const [hx, hy] = map(.9, .5); out += NS('rect', { x: (hx - 3 * Math.max(cos, .2)).toFixed(1), y: (hy - 8).toFixed(1), width: (6 * Math.max(cos, .2)).toFixed(1), height: 16, fill: '#d4a23a' });
    out += NS('polygon', { points: poly([[0, 0], [1, 0], [1, 1], [0, 1]]), fill: '#000', opacity: (.55 * sin).toFixed(3) });
    l.g.innerHTML = out;
  }
  leaves.forEach(l => drawLeaf(l, 0));

  const intro = document.getElementById('intro'), facade = document.getElementById('facade');
  const status = document.getElementById('introStatus'), spill = document.getElementById('spill');
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const tween = (ms, fn) => new Promise(res => {
    const t0 = performance.now();
    const step = now => { const t = Math.min(1, (now - t0) / ms); fn(t); t < 1 ? requestAnimationFrame(step) : res(); };
    requestAnimationFrame(step);
  });
  const wait = ms => new Promise(r => setTimeout(r, ms));

  // Called by the 3D scene once it's built. onReveal fires as the house appears behind the doorway.
  window.openFrontDoor = async (onReveal) => {
    status.classList.remove('loading');
    status.textContent = 'Welcome home';
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { onReveal && onReveal(); intro.remove(); return; }
    await wait(700);
    await tween(1600, t => { const th = 1.38 * ease(t); leaves.forEach(l => drawLeaf(l, th)); spill.setAttribute('opacity', (.55 * Math.sin(th)).toFixed(3)); });
    document.querySelector('.intro-text').style.opacity = 0;
    let revealed = false;
    await tween(1500, t => {
      const e = ease(t), s = 1 + 11 * e * e;
      facade.setAttribute('transform', `translate(800 610) scale(${s.toFixed(3)}) translate(-800 -610)`);
      if (t > .55) {
        if (!revealed) { revealed = true; onReveal && onReveal(); }
        intro.style.opacity = (1 - (t - .55) / .45).toFixed(3);
      }
    });
    intro.remove();
  };
  setTimeout(() => { if (!window.__ready && document.body.contains(intro)) status.textContent = 'Still building… this needs an internet connection'; }, 25000);
})();
</script>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ============================================================
   Coordinates come straight from the floor plan slides (pixels).
   1 px = 2 cm. x grows east, z grows south, y is up (metres).
   ============================================================ */
const S = 0.02;
const X = px => (px - 540) * S;
const Z = py => (py - 500) * S;
const GROUND = 0, UPPER = 3.4;
const COURT = -0.35;            // the nadumuttam is one step down
const EYE = 1.6;

/* ---------- renderer, scene, camera ---------- */
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
view.appendChild(renderer.domElement);

const scene = new THREE.Scene();

/* ============================================================
   Procedural textures, drawn on canvases
   ============================================================ */
function rng(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

function tex(size, draw, tile = 1, w = size, h = size) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  t.userData.tile = tile;
  return t;
}
function speckle(g, w, h, colors, n, rmax, seed, alpha = .25) {
  const r = rng(seed);
  for (let i = 0; i < n; i++) {
    g.globalAlpha = alpha * r();
    g.fillStyle = colors[Math.floor(r() * colors.length)];
    g.beginPath(); g.arc(r() * w, r() * h, r() * rmax + .4, 0, 7); g.fill();
  }
  g.globalAlpha = 1;
}

const T = {
  plaster: tex(512, (g, w, h) => { g.fillStyle = '#efe3cc'; g.fillRect(0, 0, w, h); speckle(g, w, h, ['#e2d2b4', '#f7eedd', '#d9c7a4'], 2600, 14, 3, .18); }, 2),
  white: tex(512, (g, w, h) => { g.fillStyle = '#f2eee6'; g.fillRect(0, 0, w, h); speckle(g, w, h, ['#e7e1d6', '#faf7f1'], 1500, 10, 5, .15); }, 2),
  redOxide: tex(512, (g, w, h) => {
    g.fillStyle = '#93301f'; g.fillRect(0, 0, w, h);
    speckle(g, w, h, ['#7a2216', '#a8402c', '#6a1d13', '#b04a34'], 900, 40, 7, .2);
    g.strokeStyle = 'rgba(60,15,10,.35)'; g.lineWidth = 2; g.strokeRect(0, 0, w, h);
  }, 1.2),
  teak: tex(512, (g, w, h) => {
    g.fillStyle = '#6b4226'; g.fillRect(0, 0, w, h);
    const r = rng(11);
    for (let i = 0; i < 140; i++) {
      const y = r() * h, a = r() * .25;
      g.strokeStyle = `rgba(${r() < .5 ? '40,22,12' : '140,90,55'},${a})`; g.lineWidth = 1 + r() * 3;
      g.beginPath(); g.moveTo(0, y);
      for (let x = 0; x <= w; x += 32) g.lineTo(x, y + Math.sin(x / 60 + i) * 4);
      g.stroke();
    }
  }, 1),
  oak: tex(1024, (g, w, h) => {
    const r = rng(17), plank = h / 8;
    for (let row = 0; row < 8; row++) {
      let x = -r() * 300;
      while (x < w) {
        const len = 260 + r() * 300, tone = 180 + r() * 30;
        g.fillStyle = `rgb(${tone},${tone * .76 | 0},${tone * .5 | 0})`; g.fillRect(x, row * plank, len, plank);
        for (let k = 0; k < 10; k++) { g.strokeStyle = `rgba(110,70,35,${r() * .18})`; g.lineWidth = 1; const yy = row * plank + r() * plank; g.beginPath(); g.moveTo(x, yy); g.lineTo(x + len, yy + (r() - .5) * 6); g.stroke(); }
        g.fillStyle = 'rgba(70,45,25,.5)'; g.fillRect(x, row * plank, 2, plank);
        x += len;
      }
      g.fillStyle = 'rgba(70,45,25,.45)'; g.fillRect(0, row * plank, w, 2);
    }
  }, 2.4),
  walnut: tex(1024, (g, w, h) => {
    const r = rng(23), plank = h / 8;
    for (let row = 0; row < 8; row++) {
      let x = -r() * 300;
      while (x < w) { const len = 260 + r() * 300, t = 70 + r() * 20; g.fillStyle = `rgb(${t},${t * .66 | 0},${t * .45 | 0})`; g.fillRect(x, row * plank, len, plank); g.fillStyle = 'rgba(20,10,5,.5)'; g.fillRect(x, row * plank, 2, plank); x += len; }
      g.fillStyle = 'rgba(20,10,5,.5)'; g.fillRect(0, row * plank, w, 2);
    }
  }, 2.4),
  granite: tex(512, (g, w, h) => { g.fillStyle = '#b9b2a3'; g.fillRect(0, 0, w, h); speckle(g, w, h, ['#6f6a62', '#e6e0d4', '#8d877c', '#2f2c28'], 6000, 3, 13, .55); }, .8),
  court: tex(512, (g, w, h) => {
    g.fillStyle = '#ddd0b2'; g.fillRect(0, 0, w, h); speckle(g, w, h, ['#c9b994', '#efe4cb', '#b8a782'], 3000, 5, 19, .3);
    g.strokeStyle = 'rgba(120,100,70,.45)'; g.lineWidth = 3; g.strokeRect(0, 0, w, h); g.beginPath(); g.moveTo(w / 2, 0); g.lineTo(w / 2, h); g.stroke();
  }, 1.4),
  roofTiles: tex(512, (g, w, h) => {
    g.fillStyle = '#9c4524'; g.fillRect(0, 0, w, h);
    const r = rng(29);
    for (let y = 0; y < h; y += 32) for (let x = (y / 32 % 2) * 32; x < w + 64; x += 64) {
      const t = 165 + r() * 35; g.fillStyle = `rgb(${t},${t * .45 | 0},${t * .25 | 0})`;
      g.beginPath(); g.ellipse(x, y + 16, 30, 17, 0, 0, Math.PI); g.fill();

    }
  }, 1),
  siding: tex(512, (g, w, h) => {
    g.fillStyle = '#f4f1ea'; g.fillRect(0, 0, w, h);
    for (let y = 0; y < h; y += 32) { g.fillStyle = 'rgba(150,140,120,.35)'; g.fillRect(0, y, w, 3); g.fillStyle = 'rgba(255,255,255,.6)'; g.fillRect(0, y + 3, w, 2); }
  }, 2),
  grass: tex(512, (g, w, h) => { g.fillStyle = '#6d9a46'; g.fillRect(0, 0, w, h); speckle(g, w, h, ['#5a8a3c', '#86b35c', '#4f7a34', '#97c06a'], 9000, 3, 31, .5); }, 3),
  soil: tex(256, (g, w, h) => { g.fillStyle = '#4a3020'; g.fillRect(0, 0, w, h); speckle(g, w, h, ['#3a2416', '#5e3f2a', '#2e1d12'], 2500, 3, 37, .6); }, 1),
  stone: tex(512, (g, w, h) => {
    g.fillStyle = '#e9e3d8'; g.fillRect(0, 0, w, h); speckle(g, w, h, ['#d8d0c2', '#f4f0e8'], 2000, 6, 41, .3);
    g.strokeStyle = 'rgba(150,140,125,.5)'; g.lineWidth = 3; g.strokeRect(0, 0, w, h);
  }, .9),
  marble: tex(512, (g, w, h) => {
    g.fillStyle = '#f1eee8'; g.fillRect(0, 0, w, h);
    const r = rng(43);
    for (let i = 0; i < 18; i++) { g.strokeStyle = `rgba(140,135,130,${.15 + r() * .25})`; g.lineWidth = .8 + r() * 2; g.beginPath(); let x = r() * w, y = 0; g.moveTo(x, y); while (y < h) { x += (r() - .5) * 40; y += 20 + r() * 30; g.lineTo(x, y); } g.stroke(); }
  }, 1.5),
};

/* ============================================================
   Geometry helpers (all in metres)
   ============================================================ */
const world = new THREE.Group(); scene.add(world);
function add(mesh, cast = true) { mesh.castShadow = cast; mesh.receiveShadow = true; world.add(mesh); return mesh; }

// tile = metres per texture repeat; 0 stretches the texture once over the face
function tileOf(mat) { const m = Array.isArray(mat) ? mat.find(x => x.map) : mat; if (!m || !m.map) return 0; const t = m.map.userData.tile; return t === undefined ? 1 : t; }
function boxGeo(w, h, d, tile) {
  const g = new THREE.BoxGeometry(w, h, d);
  if (tile) {
    const uv = g.attributes.uv, dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
    for (let f = 0; f < 6; f++) for (let i = 0; i < 4; i++) { const k = f * 4 + i; uv.setXY(k, uv.getX(k) * dims[f][0] / tile, uv.getY(k) * dims[f][1] / tile); }
  }
  return g;
}
// box from extents
function boxAt(mat, x0, x1, y0, y1, z0, z1, cast = true) {
  const w = Math.abs(x1 - x0), h = Math.abs(y1 - y0), d = Math.abs(z1 - z0);
  const m = new THREE.Mesh(boxGeo(w, h, d, tileOf(mat)), mat);
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  return add(m, cast);
}
// box from centre
function box(mat, x, y, z, w, h, d, cast = true) { return boxAt(mat, x - w / 2, x + w / 2, y - h / 2, y + h / 2, z - d / 2, z + d / 2, cast); }
function rbox(mat, x, y, z, w, h, d, r = .05) {
  const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 3, Math.min(r, w / 2, h / 2, d / 2)), mat);
  m.position.set(x, y, z); return add(m);
}
function cyl(mat, x, y0, z, r, h, rTop = r, seg = 28) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rTop, r, h, seg), mat);
  m.position.set(x, y0 + h / 2, z); return add(m);
}
function sphere(mat, x, y, z, r, sx = 1, sy = 1, sz = 1, detail = 16) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, detail, Math.max(8, detail * .7 | 0)), mat);
  m.position.set(x, y, z); m.scale.set(sx, sy, sz); return add(m);
}
function lathe(mat, pts, x, y0, z, seg = 40) {
  const m = new THREE.Mesh(new THREE.LatheGeometry(pts.map(([r, h]) => new THREE.Vector2(r, h)), seg), mat);
  m.position.set(x, y0, z); return add(m);
}
// a plane of canvas art facing a direction ('N' faces north, i.e. hangs on a south wall)
function panel(texture, x, y, z, w, h, face, emissive = 0) {
  const mat = new THREE.MeshStandardMaterial({ map: texture, roughness: .7, emissive: emissive ? 0xffffff : 0, emissiveMap: emissive ? texture : null, emissiveIntensity: emissive });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  m.position.set(x, y, z); m.rotation.y = { S: 0, N: Math.PI, E: Math.PI / 2, W: -Math.PI / 2 }[face];
  return add(m, false);
}
function pointLight(color, intensity, x, y, z, dist = 0) {
  const l = new THREE.PointLight(color, intensity, dist, 2); l.position.set(x, y, z); scene.add(l); return l;
}

for (const r of Object.values(ROOMS)) { const [a, b, c, d] = r.r; r.box = { x0: X(a), z0: Z(b), x1: X(c), z1: Z(d) }; }

const WALL_T = 0.15;
const trimMat = r => r.trim === 'teak' ? MAT.teak : MAT.paintWhite;

function buildRoom(key) {
  const r = ROOMS[key];
  const [px0, pz0, px1, pz1] = r.r;
  const x0 = X(px0), z0 = Z(pz0), x1 = X(px1), z1 = Z(pz1), y0 = r.fl, H = r.h;
  r.box = { x0, x1, z0, z1 };

  if (r.floor) boxAt(r.floor, x0, x1, y0 - .1, y0, z0, z1, false);
  if (r.ceil !== false) {
    boxAt(MAT.ceiling, x0, x1, y0 + H, y0 + H + .18, z0, z1);
    if (r.fl === UPPER) {                                      // flat roof with a white cornice
      boxAt(MAT.siding, x0 - .12, x1 + .12, y0 + H + .18, y0 + H + .32, z0 - .12, z1 + .12);
    }
  }

  for (const side of ['N', 'S', 'E', 'W']) {
    const alongX = side === 'N' || side === 'S';
    const from = alongX ? x0 : z0, to = alongX ? x1 : z1;
    const ops = (r.open[side] || []).map(o => ({ ...o, a: alongX ? X(o.a) : Z(o.a), b: alongX ? X(o.b) : Z(o.b) })).sort((p, q) => p.a - q.a);
    // material per box face: +x, -x, +y, -y, +z, -z
    const inner = { N: 4, S: 5, W: 0, E: 1 }[side], outer = { N: 5, S: 4, W: 1, E: 0 }[side];
    const mats = Array(6).fill(r.wall); mats[outer] = MAT.siding; mats[inner] = r.wall;
    const seg = (a, b, ya, yb) => {
      if (b - a < .005 || yb - ya < .005) return;
      if (side === 'N') boxAt(mats, a, b, ya, yb, z0, z0 + WALL_T);
      if (side === 'S') boxAt(mats, a, b, ya, yb, z1 - WALL_T, z1);
      if (side === 'W') boxAt(mats, x0, x0 + WALL_T, ya, yb, a, b);
      if (side === 'E') boxAt(mats, x1 - WALL_T, x1, ya, yb, a, b);
    };
    let cur = from;
    for (const o of ops) {
      const bottom = o.t === 'window' ? o.bottom : o.t === 'lattice' ? 1.0 : 0;
      const top = o.t === 'open' ? H : o.t === 'lattice' ? 2.1 : (o.top || (o.t === 'window' ? 2.4 : 2.2));
      seg(cur, o.a, y0, y0 + H);
      seg(o.a, o.b, y0, y0 + bottom);
      seg(o.a, o.b, y0 + top, y0 + H);
      cur = o.b;
      buildOpening(r, side, o, bottom, top);
    }
    seg(cur, to, y0, y0 + H);
  }
}

// a frame piece on the inside face of a wall
function onWall(r, side, mat, a, b, ya, yb, depth = .04, inset = 0) {
  const { x0, x1, z0, z1 } = r.box, t = WALL_T;
  if (side === 'N') return boxAt(mat, a, b, ya, yb, z0 + t - inset, z0 + t + depth - inset);
  if (side === 'S') return boxAt(mat, a, b, ya, yb, z1 - t - depth + inset, z1 - t + inset);
  if (side === 'W') return boxAt(mat, x0 + t - inset, x0 + t + depth - inset, ya, yb, a, b);
  if (side === 'E') return boxAt(mat, x1 - t - depth + inset, x1 - t + inset, ya, yb, a, b);
}
// something set in the middle of the wall's thickness
function inWall(r, side, mat, a, b, ya, yb, thick = .04) {
  const { x0, x1, z0, z1 } = r.box, t = WALL_T;
  const mid = { N: z0 + t / 2, S: z1 - t / 2, W: x0 + t / 2, E: x1 - t / 2 }[side];
  if (side === 'N' || side === 'S') return boxAt(mat, a, b, ya, yb, mid - thick / 2, mid + thick / 2, mat !== MAT.glass);
  return boxAt(mat, mid - thick / 2, mid + thick / 2, ya, yb, a, b, mat !== MAT.glass);
}

    g.fillStyle = '#5a3420'; g.fillRect(0, 0, w, h);
    const r = rng(53);
    for (let i = 0; i < 60; i++) { g.strokeStyle = `rgba(30,15,8,${r() * .3})`; g.lineWidth = 2; const y = r() * h; g.beginPath(); g.moveTo(0, y); g.lineTo(w, y + 6); g.stroke(); }
    g.fillStyle = '#3e2314'; g.fillRect(w / 2 - 3, 0, 6, h);
    for (let row = 0; row < 8; row++) for (let c = 0; c < 3; c++) for (const half of [0, 1]) {
      const cx = half * w / 2 + 24 + c * 40, cy = 40 + row * 60;
      g.fillStyle = '#d4a23a'; g.beginPath(); g.arc(cx, cy, 6, 0, 7); g.fill();
      g.fillStyle = '#fff3c4'; g.beginPath(); g.arc(cx - 2, cy - 2, 2, 0, 7); g.fill();
    }
    g.fillStyle = '#d4a23a'; g.fillRect(w / 2 - 16, h * .48, 32, 12);
  }, 0, 256, 512),
  panel: tex(256, (g, w, h) => {
    g.fillStyle = '#f5f2ec'; g.fillRect(0, 0, w, h);
    g.strokeStyle = 'rgba(0,0,0,.12)'; g.lineWidth = 6;
    g.strokeRect(36, 40, w - 72, h * .38); g.strokeRect(36, h * .5, w - 72, h * .42);
    g.fillStyle = '#c9962e'; g.beginPath(); g.arc(w - 40, h * .52, 9, 0, 7); g.fill();
  }, 0, 256, 512),
};

function buildOpening(r, side, o, bottom, top) {
  const y0 = r.fl, tm = trimMat(r), a = o.a, b = o.b;
  if (o.t === 'open') return;
  if (o.t === 'door' || o.t === 'closed') {
    const w = r.trim === 'teak' ? .16 : .09;
    onWall(r, side, tm, a - w, a, y0, y0 + top + w);
    onWall(r, side, tm, b, b + w, y0, y0 + top + w);
    onWall(r, side, tm, a - w, b + w, y0 + top, y0 + top + w);
    if (r.trim === 'teak') onWall(r, side, MAT.brass, (a + b) / 2 - .06, (a + b) / 2 + .06, y0 + top + w * .35, y0 + top + w * .65, .06);
  }
  if (o.t === 'closed') {
    const leaf = new THREE.MeshStandardMaterial({ map: o.kerala ? doorTex.kerala : doorTex.panel, roughness: o.kerala ? .5 : .45 });
    inWall(r, side, leaf, a, b, y0, y0 + top, .06);
  }
  if (o.t === 'window') {
    const f = .07;
    inWall(r, side, MAT.glass, a, b, y0 + bottom, y0 + top, .01);
    inWall(r, side, MAT.black, a, b, y0 + bottom, y0 + bottom + f, .08);
    inWall(r, side, MAT.black, a, b, y0 + top - f, y0 + top, .08);
    inWall(r, side, MAT.black, a, a + f, y0 + bottom, y0 + top, .08);
    inWall(r, side, MAT.black, b - f, b, y0 + bottom, y0 + top, .08);
    const n = Math.max(1, Math.round((b - a) / .8));
    for (let i = 1; i < n; i++) { const m = a + (b - a) * i / n; inWall(r, side, MAT.black, m - .025, m + .025, y0 + bottom, y0 + top, .06); }
    if (top - bottom > 1.6) { const m = y0 + bottom + (top - bottom) * .62; inWall(r, side, MAT.black, a, b, m - .025, m + .025, .06); }
    onWall(r, side, MAT.paintWhite, a - .06, b + .06, y0 + bottom - .04, y0 + bottom, .12);
  }
  if (o.t === 'lattice') {
    for (let m = a + .05; m < b - .02; m += .1) inWall(r, side, MAT.teak, m - .02, m + .02, y0 + bottom, y0 + top, .05);
    inWall(r, side, MAT.teak, a, b, y0 + bottom + (top - bottom) / 2 - .02, y0 + bottom + (top - bottom) / 2 + .02, .05);
    onWall(r, side, MAT.teak, a - .08, b + .08, y0 + bottom - .08, y0 + bottom, .1);
    onWall(r, side, MAT.teak, a - .08, b + .08, y0 + top, y0 + top + .08, .1);
  }
}

function slopedRoof(outer, inner, yOut, yIn, mat, offset = 0) {
  const o = outer, i = inner;
  const quads = [
    [[o.x0, yOut, o.z0], [o.x1, yOut, o.z0], [i.x1, yIn, i.z0], [i.x0, yIn, i.z0]],
    [[o.x1, yOut, o.z0], [o.x1, yOut, o.z1], [i.x1, yIn, i.z1], [i.x1, yIn, i.z0]],
    [[o.x1, yOut, o.z1], [o.x0, yOut, o.z1], [i.x0, yIn, i.z1], [i.x1, yIn, i.z1]],
    [[o.x0, yOut, o.z1], [o.x0, yOut, o.z0], [i.x0, yIn, i.z0], [i.x0, yIn, i.z1]],
  ];
  const pos = [], uv = [], tile = tileOf(mat) || 1;
  for (const q of quads) {
    const len = Math.hypot(q[1][0] - q[0][0], q[1][2] - q[0][2]);
    const slope = Math.hypot(q[3][0] - q[0][0], q[3][1] - q[0][1], q[3][2] - q[0][2]);
    const uvs = [[0, 0], [len, 0], [len, slope], [0, slope]].map(([u, v]) => [u / tile, v / tile]);
    for (const k of [0, 1, 2, 0, 2, 3]) { pos.push(q[k][0], q[k][1] + offset, q[k][2]); uv.push(...uvs[k]); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat.clone()); m.material.side = THREE.DoubleSide;
  return add(m);
}

/* ============================================================
   Furnishings for the modern-classic rooms
   ============================================================ */
const SPINES = [0x8e3b2e, 0xc4813a, 0x2f5f5a, 0xd8c9a3, 0x5a4a7a, 0xa85a3a, 0x3d5a80, 0x7a8a4a, 0xc9a04a, 0x6a2f3a, 0xe0d4b8, 0x4a6b5a];
// bookshelf against a wall; axis 'x' runs east-west, facing +1 means it faces south/east
function bookshelf(axis, fixed, from, to, y0, height, depth, facing, seed) {
  const levels = Math.round(height / .36), r = rng(seed);
  const frame = MAT.walnut;
  const at = (u0, u1, ya, yb, d0, d1) => axis === 'x' ? boxAt(frame, u0, u1, ya, yb, fixed + facing * d0, fixed + facing * d1) : boxAt(frame, fixed + facing * d0, fixed + facing * d1, ya, yb, u0, u1);
  at(from, to, y0, y0 + height, 0, .03);
  for (let i = 0; i <= levels; i++) at(from, to, y0 + i * height / levels, y0 + i * height / levels + .025, 0, depth);
  for (let u = from; u <= to + .01; u += Math.max(.6, (to - from) / Math.round((to - from) / .9))) at(u - .015, u + .015, y0, y0 + height, 0, depth);
  const books = [];
  for (let i = 0; i < levels; i++) {
    const base = y0 + i * height / levels + .025;
    let u = from + .03;
    while (u < to - .05) {
      if (r() < .05) { u += .08 + r() * .1; continue; }
      const bw = .022 + r() * .03, bh = .2 + r() * .1, bd = .16 + r() * .05;
      books.push({ u: u + bw / 2, y: base + bh / 2, w: bw, h: bh, d: bd, c: SPINES[Math.floor(r() * SPINES.length)] });
      u += bw + .002;
    }
  }
  const inst = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), M({ roughness: .7 }), books.length);
  const mtx = new THREE.Matrix4(), col = new THREE.Color();
  books.forEach((b, i) => {
    const dpos = fixed + facing * (.03 + b.d / 2);
    if (axis === 'x') mtx.compose(new THREE.Vector3(b.u, b.y, dpos), new THREE.Quaternion(), new THREE.Vector3(b.w, b.h, b.d));
    else mtx.compose(new THREE.Vector3(dpos, b.y, b.u), new THREE.Quaternion(), new THREE.Vector3(b.d, b.h, b.w));
    inst.setMatrixAt(i, mtx); inst.setColorAt(i, col.setHex(b.c));
  });
  inst.castShadow = true; inst.receiveShadow = true; world.add(inst);
}

function plant(x, y0, z, s = 1, pot = MAT.terracotta) {
  lathe(pot, [[0, 0], [.12 * s, 0], [.16 * s, .3 * s], [.17 * s, .32 * s], [.15 * s, .32 * s], [0, .3 * s]], x, y0, z, 24);
  cyl(MAT.soil, x, y0 + .27 * s, z, .15 * s, .02);
  const r = rng(Math.round(x * 100 + z * 10));
  for (let i = 0; i < 16; i++) {
    const a = r() * 6.28, rr = r() * .22 * s, hh = .4 * s + r() * .7 * s;
    sphere(r() < .5 ? MAT.leaf : MAT.leaf2, x + Math.cos(a) * rr, y0 + hh, z + Math.sin(a) * rr, .11 * s, 1.5, .55, 1, 10).rotation.set(r(), r() * 3, r());
  }
  cyl(M({ color: 0x5a6b3a }), x, y0 + .3 * s, z, .015, .8 * s);
}
function tree(x, z, s = 1) {
  cyl(M({ color: 0x6b5233, roughness: 1 }), x, 0, z, .18 * s, 3.2 * s, .12 * s, 10);
  const r = rng(Math.round(x * 31 + z * 7) + 99);

function buildStairs() {

  rail.position.copy(A).add(B).multiplyScalar(.5); rail.lookAt(B); add(rail);

function buildGarden() {
  // lawn
  const gg = new THREE.CircleGeometry(220, 64), uv = gg.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * 440 / 3, uv.getY(i) * 440 / 3);
  const lawn = new THREE.Mesh(gg, MAT.grass); lawn.rotation.x = -Math.PI / 2; lawn.position.y = -.06; add(lawn, false);
  const r = rng(7);
  const pick = a => a[Math.floor(r() * a.length)];
  const gx0 = X(83), gx1 = X(1357), gz0 = Z(138), gz1 = Z(853), hx = X(1005);

  // tidy hedges along the far edges of the property; the garden side is left to grow wild
  const hedge = M({ color: 0x3f6a34, roughness: 1 });
  rbox(hedge, (gx0 + hx) / 2, .6, gz0, hx - gx0, 1.2, .8, .3);
  rbox(hedge, (gx0 + hx) / 2, .6, gz1, hx - gx0, 1.2, .8, .3);
  rbox(hedge, gx0, .6, (gz0 + gz1) / 2, .8, 1.2, gz1 - gz0, .3);
  const greens = [0x3f6a34, 0x4f7a3a, 0x5d8a46, 0x6a9a4a, 0x356030, 0x7aa852].map(c => M({ color: c, roughness: 1 }));
  const bush = (x, z, s) => {
    const b = new THREE.Mesh(new THREE.IcosahedronGeometry(s, 1), pick(greens));
    b.position.set(x, s * .65, z); b.rotation.set(r(), r() * 6, r()); b.scale.set(1, .75 + r() * .45, 1); return add(b);
  };
  for (let x = hx; x < gx1; x += .75) { bush(x + r() * .4, gz0 + (r() - .5) * .6, .7 + r() * .7); bush(x + r() * .4, gz1 + (r() - .5) * .6, .7 + r() * .7); }
  for (let z = gz0; z < gz1; z += .75) bush(gx1 + (r() - .5) * .6, z + r() * .4, .8 + r() * .8);

  // trees: in the garden, and a ring of them beyond the property
  [[1090, 200], [1200, 240], [1310, 190], [1080, 700], [1230, 690], [1320, 760], [1340, 600], [1345, 400]].forEach(([px, pz], i) => tree(X(px), Z(pz), i % 2 ? .95 : 1.15));
  for (let i = 0; i < 26; i++) { const a = i / 26 * Math.PI * 2, d = 24 + r() * 16; tree(4 + Math.cos(a) * d, Math.sin(a) * d, .9 + r() * .7); }

  // where things are, so the wild planting leaves a way through
  const DOOR = { x: X(1005), z: Z(350) }, STANDG = { x: X(1080), z: Z(430) }, BENCH = { x: X(1290), z: Z(480) }, CHAOS = { x: X(1215), z: Z(620) };
  const segs = [[DOOR.x, DOOR.z, STANDG.x, STANDG.z], [STANDG.x, STANDG.z, BENCH.x - .9, BENCH.z]];
  const dseg = (px, pz, [ax, az, bx, bz]) => {
    const dx = bx - ax, dz = bz - az, t = THREE.MathUtils.clamp(((px - ax) * dx + (pz - az) * dz) / (dx * dx + dz * dz), 0, 1);
    return Math.hypot(px - ax - t * dx, pz - az - t * dz);
  };
  const clear = (x, z, pad = 0) => {
    if (x < hx + .3 + pad) return false;
    if (segs.some(sg => dseg(x, z, sg) < .6 + pad)) return false;
    if (x > X(1070) && x < X(1300) && z > Z(250) && z < Z(395)) return false;          // raised beds and trellis
    if (Math.hypot(x - SEED.x, z - SEED.z) < .95 + pad) return false;                  // seedling crate
    if (Math.hypot(x - BENCH.x, z - BENCH.z) < 1.45 + pad) return false;                 // reading bench
    return true;
  };
  const randIn = () => [hx + .3 + r() * (gx1 - hx - 1.0), gz0 + .7 + r() * (gz1 - gz0 - 1.4)];
  const nearChaos = () => { const a = r() * 6.28, d = Math.sqrt(r()) * 1.5; return [CHAOS.x + Math.cos(a) * d, CHAOS.z + Math.sin(a) * d]; };

  // instanced scatter: many small things with one draw call
  const scatter = (geo, n, place, cast = false) => {
    const m = new THREE.InstancedMesh(geo, M({ color: 0xffffff, roughness: .95 }), n);
    const o = new THREE.Object3D(), col = new THREE.Color();
    let k = 0;
    for (let tries = 0; tries < n * 5 && k < n; tries++) {
      const it = place(); if (!it) continue;
      o.position.set(...it.p); o.rotation.set(...(it.rot || [0, 0, 0])); o.scale.set(...(it.s || [1, 1, 1])); o.updateMatrix();
      m.setMatrixAt(k, o.matrix); m.setColorAt(k, col.setHex(it.c)); k++;
    }
    m.count = k; m.castShadow = cast; m.receiveShadow = true; world.add(m); return m;
  };

  // long, unmown grass everywhere it can get a foothold
  const blade = new THREE.ConeGeometry(.03, 1, 4); blade.translate(0, .5, 0);
  scatter(blade, 11000, () => {
    const [x, z] = r() < .15 ? nearChaos() : randIn();
    if (!clear(x, z, -.25)) return null;
    const wild = Math.hypot(x - CHAOS.x, z - CHAOS.z) < 2.5 ? 1.5 : 1;
    return { p: [x, -.05, z], s: [1, (.25 + r() * .55) * wild, 1], rot: [(r() - .5) * .6, r() * 6, (r() - .5) * .6], c: pick([0x5a8a3c, 0x6d9a46, 0x86b35c, 0x4f7a34, 0x97c06a, 0x7aa852]) };
  });
  // wildflowers, thickest in the self-seeded corner
  const FLOWERS = [0xf2a7c3, 0xffd27a, 0xffffff, 0xb9a0e0, 0xe05a2e, 0xd8402e, 0xf6e7a8, 0xff9a5c, 0xe86fa8, 0x8a7ad0];
  const bloom = new THREE.IcosahedronGeometry(.045, 0);
  scatter(bloom, 7000, () => {
    const [x, z] = r() < .25 ? nearChaos() : randIn();
    if (!clear(x, z, -.3)) return null;
    const big = r() < .2 ? 1.7 : 1;
    return { p: [x, .2 + r() * .6, z], s: [big, .6 * big, big], c: pick(FLOWERS) };
  });
  // drifts of a single colour, the way self-seeders clump
  for (let d = 0; d < 26; d++) {
    const [cx, cz] = randIn(), c = pick(FLOWERS);
    scatter(bloom, 120, () => { const a = r() * 6.28, rr = Math.sqrt(r()) * (.5 + r() * .5), x = cx + Math.cos(a) * rr, z = cz + Math.sin(a) * rr; return clear(x, z, -.3) ? { p: [x, .3 + r() * .45, z], s: [1.3, .8, 1.3], c } : null; });
  }
  // tall spires (foxgloves, lupins) leaning every which way
  const spire = new THREE.ConeGeometry(.07, .6, 6); spire.translate(0, .3, 0);
  scatter(spire, 300, () => {
    const [x, z] = r() < .35 ? nearChaos() : randIn();
    if (!clear(x, z)) return null;
    return { p: [x, .4 + r() * .3, z], rot: [(r() - .5) * .4, 0, (r() - .5) * .4], c: pick([0x9a86c8, 0xd98ac0, 0xf2f2fb, 0xe3a0c8]) };
  });
  // ivy climbing the back of the house
  const ivyLeaf = new THREE.IcosahedronGeometry(.05, 0);
  const openings = [[Z(195), Z(290)], [Z(310), Z(390)], [Z(400), Z(452)]];
  scatter(ivyLeaf, 1800, () => {
    const z = gz0 + 1 + r() * (Z(805) - gz0 - 1), y = Math.pow(r(), 1.6) * 3.3;
    if (y > .55 && openings.some(([a, b]) => z > a - .05 && z < b + .05)) return null;
    if (y < 2.4 && z > Z(310) - .1 && z < Z(390) + .1) return null;                  // keep the garden door clear
    return { p: [hx + .03 + r() * .05, y, z], s: [.5, 1, 1], c: r() < .12 ? pick([0xf2a7c3, 0xffffff, 0xe86fa8]) : pick([0x2f5a2a, 0x3f6a34, 0x4f7a3a, 0x5d8a46]) };
  });

  // shrubs, some in flower
  for (let i = 0, n = 0; i < 400 && n < 46; i++) {
    const [x, z] = randIn(); if (!clear(x, z, .35)) continue; n++;
    const s = .35 + r() * .6; bush(x, z, s);
    if (r() < .75) { const c = fabric(pick([0xb9c8f0, 0xd6c2ef, 0xf2f2fb, 0xf2a7c3, 0xffd27a, 0xe86fa8])); for (let k = 0; k < 9; k++) { const a = r() * 6.28; sphere(c, x + Math.cos(a) * s * .7, s * (1.0 + r() * .3), z + Math.sin(a) * s * .7, .09 + r() * .04, 1, 1, 1, 8); } }
  }
  // ferns
  for (let i = 0, n = 0; i < 300 && n < 20; i++) {
    const [x, z] = randIn(); if (!clear(x, z, .2)) continue; n++;
    for (let k = 0; k < 8; k++) {
      const a = k / 8 * 6.28 + r() * .3;
      const f = new THREE.Mesh(new THREE.SphereGeometry(.1, 8, 6), k % 2 ? MAT.leaf : MAT.leaf2);
      f.rotation.order = 'YXZ'; f.rotation.set(-.55 - r() * .3, a, 0); f.scale.set(.7, .18, 3.2);
      f.position.set(x + Math.sin(a) * .22, .22, z + Math.cos(a) * .22); add(f);
    }
  }

  // a toppled pot in the wild corner, still flowering where it fell
  const pot = lathe(MAT.terracotta, [[0, 0], [.14, 0], [.19, .36], [.2, .38], [.17, .38], [0, .34]], CHAOS.x + .35, .2, CHAOS.z - .25, 24);
  pot.rotation.set(Math.PI / 2 - .15, 0, .9);
  for (let k = 0; k < 14; k++) sphere(fabric(pick([0xd8402e, 0xffd27a, 0xffffff])), CHAOS.x + .15 - r() * .5, .08 + r() * .2, CHAOS.z - .1 + r() * .5, .05, 1, .6, 1, 8);

  // raised beds, overflowing
  for (const [a, b, kind] of [[1086, 1176, 'tomato'], [1200, 1290, 'greens']]) {
    boxAt(MAT.teak, X(a), X(b), 0, .45, Z(350), Z(384));
    boxAt(MAT.soil, X(a) + .05, X(b) - .05, .4, .46, Z(350) + .05, Z(384) - .05, false);
    for (let i = 0; i < 5; i++) {
      const x = X(a) + .25 + i * (X(b) - X(a) - .5) / 4, z = (Z(350) + Z(384)) / 2;
      if (kind === 'tomato') {
        cyl(MAT.leaf, x, .46, z, .012, .8);
        for (let k = 0; k < 8; k++) sphere(MAT.leaf2, x + (r() - .5) * .4, .6 + r() * .6, z + (r() - .5) * .4, .1, 1.4, .6, 1, 8);
        for (let k = 0; k < 4; k++) sphere(M({ color: 0xd8402e, roughness: .4 }), x + (r() - .5) * .3, .6 + r() * .4, z + (r() - .5) * .3, .045);
      } else for (let k = 0; k < 9; k++) sphere(k % 2 ? MAT.leaf : MAT.leaf2, x + (r() - .5) * .3, .55, z + (r() - .5) * .3, .11, 1, 1.4, .5, 8).rotation.y = k;
    }
    for (let k = 0; k < 12; k++) sphere(MAT.leaf2, X(a) + r() * (X(b) - X(a)), .2 + r() * .25, Z(384) + .05, .08, 1.2, 1, .4, 8);   // spilling over the edge
  }
  // bean trellis, smothered

  arch.position.set(X(1188), 1.4, Z(300)); add(arch);
  [-1, 1].forEach(s => cyl(MAT.teak, X(1188) + s, 0, Z(300), .04, 1.4));
  for (let i = 0; i < 60; i++) { const t = r() * Math.PI, rr = 1.0 + (r() - .5) * .15; sphere(r() < .7 ? MAT.leaf2 : MAT.leaf, X(1188) + Math.cos(t) * rr, 1.4 + Math.sin(t) * rr, Z(300) + (r() - .5) * .3, .1, 1.4, .7, 1, 8); }
  for (let i = 0; i < 16; i++) { const t = r() * Math.PI; sphere(fabric(0xf2a7c3), X(1188) + Math.cos(t), 1.4 + Math.sin(t) - .05, Z(300) + (r() - .5) * .3, .045); }

  // seedlings waiting on an upturned crate, the watering can beside it

  boxAt(MAT.teakDark, sx - .36, sx + .36, by - .03, by, sz - .26, sz + .26);
  for (const i of [-1, 1]) for (const j of [-1, 1]) boxAt(MAT.teakDark, sx + i * .33 - .03, sx + i * .33 + .03, 0, by, sz + j * .23 - .03, sz + j * .23 + .03);
  boxAt(MAT.black, sx - .3, sx + .3, by, by + .07, sz - .2, sz + .2);

  plant(sx - .6, 0, sz + .1, .55);

  const handle = new THREE.Mesh(new THREE.TorusGeometry(.1, .015, 8, 20, Math.PI), can); handle.position.set(sx + .6, .3, sz + .1); add(handle);

    for (let i = 0; i <= n; i++) { const t = i / n; const st = cyl(MAT.stone, ax + (bx2 - ax) * t + (r() - .5) * .15, -.055, az + (bz2 - az) * t + (r() - .5) * .15, .26 + r() * .06, .06); st.scale.z = .7 + r() * .3; st.rotation.y = r() * 3; }
  }
  // stepping stones from the front door
  for (let i = 0; i < 8; i++) { const st = cyl(MAT.stone, X(684) + i * .9, -.05, Z(826) + Math.sin(i) * .2, .3, .06); st.scale.z = .7; }

  // the reading bench: deep cushions, a book left open, tea, under a rose-covered arbour
  const bx = BENCH.x, bz = BENCH.z, L = 1.7;
  boxAt(MAT.teak, bx - .32, bx + .32, .42, .47, bz - L / 2, bz + L / 2);

  const back = boxAt(MAT.teak, bx + .25, bx + .3, .47, 1.08, bz - L / 2, bz + L / 2); back.rotation.z = -.18;

  const p1 = rbox(fabric(0xe3a83b), bx + .15, .8, bz - .45, .16, .44, .44, .07); p1.rotation.z = -.28;
  const p2 = rbox(fabric(0xc76b54), bx + .15, .78, bz + .38, .16, .4, .4, .07); p2.rotation.set(.18, 0, -.22);
  rbox(fabric(0xf2efe6), bx - .05, .63, bz + L / 2 - .2, .62, .05, .32, .02);
  rbox(fabric(0x5f7d6e), bx - .05, .66, bz + L / 2 - .2, .62, .02, .1, .01);
  box(M({ color: 0x3d5a80, roughness: .6 }), bx - .12, .603, bz - .1, .22, .012, .3);
  const pg1 = box(M({ color: 0xf7f2e6 }), bx - .12, .615, bz - .175, .2, .016, .14); pg1.rotation.x = .12;
  const pg2 = box(M({ color: 0xf7f2e6 }), bx - .12, .615, bz - .025, .2, .016, .14); pg2.rotation.x = -.12;
  const tz = bz - L / 2 - .45;
  cyl(MAT.teak, bx - .05, 0, tz, .03, .55); cyl(MAT.teak, bx - .05, .55, tz, .24, .03); cyl(MAT.teak, bx - .05, 0, tz, .16, .03);
  lathe(M({ color: 0xf2efe6, roughness: .3 }), [[0, 0], [.045, 0], [.05, .1], [.045, .1], [0, .1]], bx - .12, .58, tz + .06, 20);
  [[0x8e3b2e, 0], [0xc9a04a, .04]].forEach(([c, h]) => box(M({ color: c, roughness: .7 }), bx + .04, .6 + h, tz - .05, .16, .035, .22));
  cyl(MAT.black, bx - .02, .58, tz - .14, .05, .02); cyl(glow(0xffe0a0, 1.2), bx - .02, .6, tz - .14, .035, .1); cyl(MAT.black, bx - .02, .7, tz - .14, .05, .02, .02);
  // arbour
  const ax0 = bx - .65, ax1 = bx + .5, az0 = bz - L / 2 - .2, az1 = bz + L / 2 + .2, top = 2.35;

  for (const x of [ax0, ax1]) boxAt(MAT.teak, x - .05, x + .05, top, top + .1, az0 - .2, az1 + .2);
  for (let z = az0; z <= az1 + .01; z += .3) boxAt(MAT.teak, ax0 - .2, ax1 + .2, top + .1, top + .16, z - .025, z + .025);
  for (let i = 0; i < 90; i++) sphere(r() < .6 ? MAT.leaf : MAT.leaf2, ax0 - .2 + r() * (ax1 - ax0 + .4), top + .05 + r() * .3, az0 - .2 + r() * (az1 - az0 + .4), .14 + r() * .1, 1.3, .7, 1, 8);
  for (let i = 0; i < 26; i++) { const z = r() < .5 ? az0 : az1, x = ax0 + r() * (ax1 - ax0); sphere(MAT.leaf2, x, top - r() * 1.4, z, .1, 1, 1.3, .7, 8); }
  for (let i = 0; i < 40; i++) sphere(fabric(r() < .7 ? 0xf2a7c3 : 0xffffff), ax0 - .15 + r() * (ax1 - ax0 + .3), top - .1 + r() * .45, az0 - .15 + r() * (az1 - az0 + .3), .05, 1, 1, 1, 8);
  tree(bx + 1.0, bz - 1.6, 1.25);
}

/* ============================================================
   Sky dome and sun
   ============================================================ */
function buildSky() {
  const t = tex(512, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, '#2f7fd0'); gr.addColorStop(.38, '#7db7e6'); gr.addColorStop(.5, '#d6ecf7'); gr.addColorStop(.52, '#cfe1d2'); gr.addColorStop(1, '#a9c49a');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.fillStyle = 'rgba(255,255,255,.7)';
    const r = rng(83);
    for (let i = 0; i < 14; i++) { const x = r() * w, y = h * (.2 + r() * .25); for (let k = 0; k < 6; k++) { g.beginPath(); g.ellipse(x + k * 10, y + (r() - .5) * 6, 18 + r() * 12, 6 + r() * 4, 0, 0, 7); g.fill(); } }
  }, 1, 1024, 512);
  const sky = new THREE.Mesh(new THREE.SphereGeometry(600, 48, 24), new THREE.MeshBasicMaterial({ map: t, side: THREE.BackSide, fog: false, toneMapped: false }));
  scene.add(sky);
  const sunDisc = new THREE.Mesh(new THREE.CircleGeometry(14, 32), new THREE.MeshBasicMaterial({ color: 0xfffbe6, toneMapped: false }));
  sunDisc.position.copy(SUN_DIR).multiplyScalar(560); sunDisc.lookAt(0, 0, 0); scene.add(sunDisc);
}

/* ============================================================
   Places to stand, doors to walk through, notes to find
   ============================================================ */
const P = (px, pz, y) => new THREE.Vector3(X(px), y, Z(pz));
const SEED = { x: X(1150), z: Z(505), y: .42 };
const STAND = {
  atrium:  { name: 'The Nalukettu', floor: 'Ground floor', pos: new THREE.Vector3(CYC.x, COURT + EYE, CYC.z), yaw: 0 },
  kitchen: { name: 'Kitchen', floor: 'Ground floor', pos: P(684, 410, EYE), yaw: 0 },
  library: { name: 'Library & Movie Room', floor: 'Ground floor', pos: P(400, 620, EYE), yaw: Math.PI / 2 },
  garden:  { name: 'Garden', floor: 'Outside', pos: P(1080, 430, EYE), yaw: -Math.PI / 2 - .2, pitch: -.14 },
  open:    { name: 'Open Space', floor: 'Upper floor', pos: P(642, 370, UPPER + EYE), yaw: 0, pitch: -.28 },
  study:   { name: 'Study', floor: 'Upper floor', pos: P(200, 330, UPPER + EYE), yaw: Math.PI / 2 },
  master:  { name: 'Master Bedroom', floor: 'Upper floor', pos: P(320, 600, UPPER + EYE), yaw: -Math.PI / 2 },
  closet:  { name: 'Closet', floor: 'Upper floor', pos: P(172, 625, UPPER + EYE), yaw: Math.PI / 2 + .35, pitch: -.1 },
};
const ORDER = ['atrium', 'library', 'kitchen', 'garden', 'open', 'study', 'master', 'closet'];

// doors: which doorway you pass through, and the path you walk
const DOORS = [
  { from: 'atrium', to: 'kitchen', gap: 'ka', path: [P(684, 520, EYE), P(684, 452, EYE), P(684, 410, EYE)] },
  { from: 'kitchen', to: 'atrium', gap: 'ka', path: [P(684, 452, EYE), P(684, 500, EYE)] },
  { from: 'atrium', to: 'library', gap: 'la', path: [P(560, 620, EYE), P(498, 620, EYE), P(440, 620, EYE)] },
  { from: 'library', to: 'atrium', gap: 'la', path: [P(498, 620, EYE), P(540, 620, EYE)] },
  { from: 'kitchen', to: 'garden', gap: 'kg', path: [P(800, 425, EYE), P(975, 432, EYE), P(985, 352, EYE), P(1005, 350, EYE), P(1040, 360, EYE)] },
  { from: 'garden', to: 'kitchen', gap: 'kg', path: [P(1040, 360, EYE), P(1005, 350, EYE), P(982, 352, EYE), P(975, 432, EYE), P(800, 425, EYE)] },
  { from: 'atrium', to: 'open', gap: 'st',
    path: [P(700, 680, COURT + EYE), P(790, 680, EYE), P(830, 756, EYE), P(900, 756, EYE), P(937, 730, EYE), P(937, 600, UPPER * .55 + EYE), P(937, 470, UPPER + EYE), P(937, 420, UPPER + EYE), P(800, 360, UPPER + EYE)] },
  { from: 'open', to: 'atrium', gap: 'sd',
    path: [P(800, 360, UPPER + EYE), P(937, 420, UPPER + EYE), P(937, 470, UPPER + EYE), P(937, 600, UPPER * .45 + EYE), P(937, 730, EYE), P(900, 756, EYE), P(830, 756, EYE), P(790, 680, EYE), P(720, 640, COURT + EYE)] },
  { from: 'open', to: 'study', gap: 'os', path: [P(330, 301, UPPER + EYE), P(283, 301, UPPER + EYE), P(240, 310, UPPER + EYE)] },
  { from: 'study', to: 'open', gap: 'os', path: [P(283, 301, UPPER + EYE), P(340, 310, UPPER + EYE)] },
  { from: 'open', to: 'master', gap: 'om', path: [P(412, 350, UPPER + EYE), P(412, 394, UPPER + EYE), P(400, 450, UPPER + EYE)] },
  { from: 'master', to: 'open', gap: 'om', path: [P(412, 394, UPPER + EYE), P(430, 330, UPPER + EYE)] },
  { from: 'master', to: 'closet', gap: 'mc', path: [P(250, 635, UPPER + EYE), P(206, 635, UPPER + EYE)] },
  { from: 'closet', to: 'master', gap: 'mc', path: [P(206, 635, UPPER + EYE), P(260, 620, UPPER + EYE)] },
];

// each doorway: the wall it sits in (plan px), its span along that wall, floor and height
const GAPS = {
  ka: { axis: 'z', at: 452, a: 633, b: 735, y0: GROUND, h: 2.3 },
  la: { axis: 'x', at: 498, a: 577, b: 663, y0: GROUND, h: 2.3 },
  st: { axis: 'x', at: 870, a: 713, b: 800, y0: GROUND, h: 2.3 },
  kg: { axis: 'x', at: 1005, a: 315, b: 385, y0: GROUND, h: 2.3, inset: -WALL_T / 2 },
  os: { axis: 'x', at: 283, a: 259, b: 344, y0: UPPER, h: 2.2 },
  om: { axis: 'z', at: 394, a: 373, b: 452, y0: UPPER, h: 2.2 },
  mc: { axis: 'x', at: 206, a: 600, b: 670, y0: UPPER, h: 2.2 },
  sd: { axis: 'z', at: 394, a: 869, b: 1001, y0: UPPER, h: 2.6 },
};
// Each doorway gets an invisible block that fills the opening, the wall's thickness on both sides,
// and the frame around it, so it can be clicked from any angle. A soft glow plane shows on hover.
const FRAME = .2;
const doorTargets = [];
for (const [key, g] of Object.entries(GAPS)) {
  const along = g.axis === 'z' ? [X(g.a), X(g.b)] : [Z(g.a), Z(g.b)];
  const w = along[1] - along[0], mid = (along[0] + along[1]) / 2, y = g.y0 + g.h / 2;
  const glowPlane = new THREE.Mesh(new THREE.PlaneGeometry(w, g.h),
    new THREE.MeshBasicMaterial({ color: 0xffe2a8, transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide }));
  const hit = new THREE.Mesh(new THREE.BoxGeometry(w + FRAME * 2, g.h + FRAME, WALL_T * 2 + .16),
    new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false, colorWrite: false, side: THREE.DoubleSide }));
  for (const m of [glowPlane, hit]) {
    if (g.axis === 'z') m.position.set(mid, y, Z(g.at));
    else { m.position.set(X(g.at) + (g.inset || 0), y, mid); m.rotation.y = Math.PI / 2; }
    scene.add(m);
  }
  hit.position.y += FRAME / 2;
  hit.userData = { gap: key, glow: glowPlane };
  doorTargets.push(hit);
}

// notes, in the same order as classic.html so progress is shared
const NOTES = {
  atrium: [
    { at: new THREE.Vector3(AT.x0 + 1.2, .9, AT.z0 + .3), c: '#ffe58a', r: -3, text: 'Find more community and build weekly rituals with others' },
    { at: new THREE.Vector3(X(800) + .6, 1.25, AT.z0 + .1), c: '#bfe3ff', r: 2, text: 'Learn more new languages' },
    { at: new THREE.Vector3(CY.x0 + .55, COURT + 1.3, CY.z1 - .5), c: '#ffd3a1', r: -1, text: 'Bring your cultural practices and traditions into your personal life' },
    { at: new THREE.Vector3(X(785) - .1, .62, AT.z1 - .45), c: '#c8f0b5', r: 3, text: 'Depend less on your phone' },
  ],
  library: [
    { at: new THREE.Vector3(ROOMS.library.box.x0 + 1.9, .95, ROOMS.library.box.z0 + 1.1), c: '#ffe58a', r: -2, text: 'Keep reading, but read more nonfiction' },
    { at: new THREE.Vector3(X(290), 1.9, ROOMS.library.box.z1 - .3), c: '#ffc2d1', r: 2, text: 'Commit to more long form media in my life' },
  ],
  kitchen: [{ at: new THREE.Vector3(X(600), 1.12, (Z(356) + Z(386)) / 2), c: '#ffd3a1', r: -2, text: 'Cook more “fancy” food' }],
  garden: [
    { at: new THREE.Vector3(SEED.x, SEED.y + .3, SEED.z), c: '#c8f0b5', r: 2, text: 'Be more of a gardener' },
    { at: new THREE.Vector3(X(1215), .95, Z(620)), c: '#ffc2d1', r: -3, text: 'Be more accepting of chaos in my life, and less dependent on order' },
  ],
  open: [{ at: new THREE.Vector3(X(642), UPPER + .45, ROOMS.open.box.z0 + 1.2), c: '#bfe3ff', r: -2, text: 'Meditate more often' }],
  study: [
    { at: new THREE.Vector3(ROOMS.study.box.x0 + .2, UPPER + 1.6, Z(290)), c: '#ffe58a', r: -3, text: 'Find an issue you’re more passionate about that fits your workload' },
    { at: new THREE.Vector3(ROOMS.study.box.x1 - .2, UPPER + 2.1, Z(370)), c: '#c8f0b5', r: 2, text: 'Work less, but still love your work' },
  ],
  master: [{ at: new THREE.Vector3(ROOMS.master.box.x1 - .25, UPPER + 2.05, Z(570)), c: '#ffc2d1', r: -2, text: 'Be married, or maybe adopt a kid' }],
  closet: [{ at: new THREE.Vector3((ROOMS.closet.box.x0 + ROOMS.closet.box.x1) / 2, UPPER + 1.4, ROOMS.closet.box.z1 - .25), c: '#ffc2d1', r: 2, text: 'Dress differently and be more confident in your physical presence' }],
};
const TOTAL = Object.values(NOTES).reduce((n, a) => n + a.length, 0);

/* ============================================================
   Build everything
   ============================================================ */
const flames = [];
await document.fonts.load('44px Kalam').catch(() => {});
for (const k of Object.keys(ROOMS)) buildRoom(k);
buildNalukettu(); buildKitchen(); buildLibrary(); buildOpen(); buildStudy(); buildMaster(); buildCloset(); buildStairs(); buildGarden(); buildSky();

/* ============================================================
   Looking around, walking, hotspots
   ============================================================ */
let room = 'atrium', yaw = 0, pitch = 0, walking = null;
let found = new Set();
try { found = new Set(JSON.parse(localStorage.getItem('dreamhome-found') || '[]')); } catch (e) {}
const save = () => { try { localStorage.setItem('dreamhome-found', JSON.stringify([...found])); } catch (e) {} };

const hud = document.getElementById('hud');
const fade = document.getElementById('fade');
let hotspots = [];

function setHotspots() {
  hud.innerHTML = ''; hotspots = [];
  (NOTES[room] || []).forEach((n, k) => {
    const el = document.createElement('button');
    el.className = 'spot' + (found.has(`${room}-${k}`) ? ' done' : '');
    el.setAttribute('aria-label', 'Read a note');
    el.addEventListener('click', e => { e.stopPropagation(); openNote(k, el); });
    hud.appendChild(el); hotspots.push({ el, at: n.at });
  });
}

const DIRN = ['north', 'west', 'south', 'east'];
function updateTitle() {
  document.getElementById('roomName').textContent = STAND[room].name;
  const q = ((Math.round(yaw / (Math.PI / 2)) % 4) + 4) % 4;
  document.getElementById('roomFloor').textContent = `${STAND[room].floor} · facing ${DIRN[q]}`;
  document.getElementById('foundCount').textContent = `${found.size} of ${TOTAL} notes found`;
}

function arrive(key, keepView) {
  room = key;
  if (!keepView) { camera.position.copy(STAND[key].pos); yaw = STAND[key].yaw; pitch = STAND[key].pitch || 0; }
  setHotspots(); updateTitle(); renderMenu();
}

function jump(key) {
  closeNote();
  fade.style.opacity = 1;
  setTimeout(() => { walking = null; arrive(key); fade.style.opacity = 0; }, 300);
}

function walk(door) {
  closeNote();
  hud.innerHTML = ''; hotspots = [];
  const pts = [camera.position.clone(), ...door.path.map(p => p.clone()), STAND[door.to].pos.clone()];
  const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal');
  walking = { curve, t: 0, dur: Math.max(1.4, curve.getLength() / 1.9), to: door.to };
}

const lerpAngle = (a, b, t) => { let d = ((b - a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI; return a + d * t; };

/* ---------- notes ---------- */
function closeNote() { document.querySelector('.note')?.remove(); }
function openNote(k, spot) {
  closeNote();
  const n = NOTES[room][k];
  found.add(`${room}-${k}`); save(); updateTitle(); spot.classList.add('done');
  const el = document.createElement('div');
  el.className = 'note'; el.setAttribute('role', 'dialog');
  el.style.setProperty('--c', n.c); el.style.setProperty('--r', `${n.r}deg`);
  const b = spot.getBoundingClientRect(), x = b.left + b.width / 2, y = b.top + b.height / 2;
  if (x > innerWidth * .6) el.style.right = `${innerWidth - x + 30}px`; else el.style.left = `${x + 30}px`;
  if (y > innerHeight * .55) el.style.bottom = `${Math.max(10, innerHeight - y - 20)}px`; else el.style.top = `${Math.max(66, y - 30)}px`;
  el.innerHTML = `<button class="close" aria-label="Close note">×</button>${n.text}`;
  el.querySelector('.close').addEventListener('click', closeNote);
  document.body.appendChild(el);
}

/* ---------- menu ---------- */
const menu = document.getElementById('menu');
function renderMenu() {
  menu.innerHTML = '<h3>Ground floor</h3>' + ORDER.filter(k => STAND[k].floor !== 'Upper floor').map(k => `<button data-k="${k}" class="${k === room ? 'here' : ''}">${STAND[k].name}</button>`).join('') +
    '<h3>Upper floor</h3>' + ORDER.filter(k => STAND[k].floor === 'Upper floor').map(k => `<button data-k="${k}" class="${k === room ? 'here' : ''}">${STAND[k].name}</button>`).join('');
}
document.getElementById('menuBtn').addEventListener('click', e => { e.stopPropagation(); menu.hidden = !menu.hidden; });
menu.addEventListener('click', e => { const b = e.target.closest('button[data-k]'); if (b) { menu.hidden = true; jump(b.dataset.k); } });

/* ---------- doorways: hover to light them, click or tap to walk through ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let hovered = null;
function doorAt(clientX, clientY) {
  if (walking) return null;
  ndc.set(clientX / innerWidth * 2 - 1, -(clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const mine = doorTargets.filter(t => DOORS.some(d => d.from === room && d.gap === t.userData.gap));
  const hit = ray.intersectObjects(mine, false)[0];
  return hit ? { target: hit.object, door: DOORS.find(d => d.from === room && d.gap === hit.object.userData.gap) } : null;
}
function setHover(target) {
  if (hovered === target) return;
  if (hovered) hovered.userData.glow.material.opacity = 0;
  hovered = target;
  if (hovered) hovered.userData.glow.material.opacity = .16;
  view.style.cursor = hovered ? 'pointer' : '';
}

/* ---------- drag to look, wheel to zoom ---------- */
let drag = null;
view.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, yaw, pitch, moved: false }; view.setPointerCapture(e.pointerId); });
view.addEventListener('pointermove', e => {
  if (!drag) { if (e.pointerType === 'mouse') { const d = doorAt(e.clientX, e.clientY); setHover(d && d.target); } return; }
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) > 4) { drag.moved = true; view.classList.add('dragging'); closeNote(); document.getElementById('hint').style.opacity = 0; }
  if (drag.moved) {
    const k = (camera.fov / 68) * .0045;
    yaw = drag.yaw + dx * k; pitch = THREE.MathUtils.clamp(drag.pitch + dy * k, -1.35, 1.35);
  }
});
const endDrag = e => {
  if (drag && !drag.moved && e.type === 'pointerup') {
    const busy = document.querySelector('.note') || !menu.hidden;   // a tap first just closes an open note or menu
    closeNote(); menu.hidden = true;
    const d = !busy && doorAt(e.clientX, e.clientY);
    if (d) { setHover(null); walk(d.door); }
  }
  drag = null; view.classList.remove('dragging');
};
view.addEventListener('pointerup', endDrag); view.addEventListener('pointercancel', endDrag);
view.addEventListener('wheel', e => { e.preventDefault(); camera.fov = THREE.MathUtils.clamp(camera.fov + e.deltaY * .03, 30, 85); camera.updateProjectionMatrix(); }, { passive: false });
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') yaw += .25; if (e.key === 'ArrowRight') yaw -= .25;
  if (e.key === 'ArrowUp') pitch = Math.min(1.35, pitch + .15); if (e.key === 'ArrowDown') pitch = Math.max(-1.35, pitch - .15);
  if (e.key === 'Escape') { closeNote(); menu.hidden = true; }
});
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

/* ---------- frame loop ---------- */
const clock = new THREE.Clock(), v = new THREE.Vector3();
let frameNo = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  if (walking) {
    walking.t = Math.min(1, walking.t + dt / walking.dur);
    const e = walking.t < .5 ? 2 * walking.t * walking.t : 1 - Math.pow(-2 * walking.t + 2, 2) / 2;
    camera.position.copy(walking.curve.getPointAt(e));
    const tan = walking.curve.getTangentAt(Math.min(.999, e + .02));
    if (Math.hypot(tan.x, tan.z) > .05) yaw = lerpAngle(yaw, Math.atan2(-tan.x, -tan.z), .08);
    pitch *= .9;
    if (walking.t >= 1) { const to = walking.to; walking = null; arrive(to, true); }
  }
  camera.rotation.set(pitch, yaw, 0);
  for (const f of flames) f.intensity = 2.2 + Math.sin(t * 13) * .25 + Math.sin(t * 29) * .15;
  for (const h of hotspots) {
    v.copy(h.at).project(camera);
    const vis = v.z < 1 && Math.abs(v.x) < 1.2 && Math.abs(v.y) < 1.2;
    h.el.style.display = vis ? '' : 'none';
    if (vis) h.el.style.transform = `translate(${(v.x * .5 + .5) * innerWidth}px, ${(-v.y * .5 + .5) * innerHeight}px)`;
  }
  if (!walking && ++frameNo % 10 === 0) updateTitle();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// #kitchen or #kitchen-east opens a room facing a direction
// Every visit starts the same way: through the front door and into the Nalukettu.
if (location.hash) history.replaceState(null, '', location.pathname + location.search);
arrive('atrium');
camera.position.set(X(684), EYE, AT.z1 - .3); yaw = 0; pitch = 0;   // just inside the front door, looking into the courtyard
hud.innerHTML = ''; hotspots = [];
updateTitle();
if (new URLSearchParams(location.search).has('up')) pitch = .9;
frame();
window.__ready = true;
const hint = document.getElementById('hint');
window.openFrontDoor(() => {
  walk({ to: 'atrium', path: [P(684, 745, EYE)] });
  hint.style.opacity = 1;
  setTimeout(() => { hint.style.opacity = 0; }, 7000);
});
</script>
